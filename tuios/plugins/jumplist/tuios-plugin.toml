api = 1
id = "jonasws.jumplist"
name = "Jump list"
version = "0.1.0"
description = "Records the workspaces you visit, across sessions, as a Vim-style jump list"
platforms = ["macos", "linux"]

# Reads the event stream of every session. The jumps themselves run from
# command keys in config.toml with your own rights, so the plugin needs no more.
[permissions]
grants = ["read"]

# Event hooks, not a startup process: tuios refuses a live upgrade while a
# plugin command runs, and a startup process never stops running.
# tab is a tuios workspace and workspace a tuios session, in herdr's names.
[[process]]
id = "record"
run = "event"
on = ["tab.focused", "workspace.focused", "tab.closed", "workspace.closed"]
command = ["/usr/bin/python3", "./jumplist.py", "event"]
