# tuios configuration, linked to ~/.config/tuios/config.toml.
# `tuios list-options` and the docs at https://tuios.dev/docs/configuration
# have every key. Keys here mirror herdr/config.toml where tuios has a match:
# a herdr workspace is a tuios session, a herdr tab a tuios workspace, a herdr
# pane a tuios window.

# A config file that leaves `daemon` and `tiled` out reads them as false, the
# floating, standalone start of tuios before 0.8. Both stay spelled out even
# though they match the documented defaults.
[startup]
daemon = true
tiled = true
layout = "bsp"
# herdr has no window mode: keys go to the pane, and the prefix does the rest.
start_in_terminal_mode = true

[appearance]
# Ghostty's bundled Catppuccin Mocha, sixteen for sixteen (themes/): tuios's
# own catppuccin_mocha keeps the brights equal to the normals.
theme = "mocha-ghostty"
# On a light terminal, and when the host (Ghostty) switches to light.
theme_light = "catppuccin_latte"
# Ghostty and WezTerm both draw kitty unicode placeholders.
kitty_placeholders = "on"
# Mauve, the theme's accent. The theme has no role for the focused border: it
# takes the success green in terminal mode. Unfocused borders are in the theme.
border_focused_color = "accent"
# Split across the longer side, so a new pane on a wide screen goes right and
# on a tall one goes down, close to picking herdr's split direction by hand.
tiling_scheme = "smart_split"
# Window slides and the copy sweep stay; overlay fades and the working-agent
# shimmer go.
motion = "basic"
border_style = "glyphs"
# The default cap of 12 cells cuts "dotfiles › topic" workspace names to
# "dotfiles › …". The full name still shows on hover.
dock_workspace_label_max = 28
# Frame the larger panels (agents view, palette) like the dialogs, so Cmd+K's
# navigator and the agents view read as one family. Colours are the theme's.
frame_panels = true

# Dock messages show the icon and text, without the side bar and countdown line.
[notifications]
style = "plain"

# The default right list minus "notifications". tuios announces "Window created
# (N total)" and similar with no setting to turn them off, and the dock is the
# only place they draw. Messages still go to the log viewer; agent alerts keep
# the Inbox and the desktop notification.
[dock]
right = ["transfers", "copy-help", "cpu", "ram", "clock", "session-controls"]

# herdr resumes agent conversations on its own after a restart. The default,
# "ask", leaves a Resume row in the Inbox for each pane instead. Since 0.12 an
# agent started with a flag that turns approvals off is not resumed by "auto";
# its Resume row waits for y in the agents view.
[daemon]
resume_agents = "auto"

# Fold the Working group in the agents view (prefix+i) until it is opened, so
# the view leads with what needs me. F folds or opens any group.
[agents]
fold_working = true

# Claude Code's permission prompts and plans wait in the Inbox, where they are
# answered without going to the pane: a/1 allow, A/2 always, r/3 reject, R
# reject with a reason. The waiting hook is the PermissionRequest entry of
# integration v3 in claude/settings.json; `tuios integration status
# claude-code` says whether it is current. A command that matches a risk rule
# takes a second press to allow.
[agents.approvals]
enabled = ["claude-code"]
hold_seconds = 120

# The shipped rules cover terraform, kubectl, force pushes, rm -rf and the
# rest; these add the CDK and AWS calls the *-infra repos make. In auto mode
# only what claude/settings.json asks about reaches the Inbox: every `aws` and
# `fnox exec` call does, so these pick out the destructive ones among them,
# also when fnox exec wraps them. RE2, matched against each command of a shell
# call; `.*` lets global options such as --profile sit before the subcommand.
[agents.approvals.risk]
builtin = true

[[agents.approvals.risk.rule]]
name = "cdk deploy/destroy"
tools = ["Bash"]
pattern = '\bcdk\b.*\s(deploy|destroy|import)\b'

[[agents.approvals.risk.rule]]
name = "cloudformation change"
tools = ["Bash"]
pattern = '\baws\b.*\scloudformation\b.*\s(delete-stack|deploy|execute-change-set)\b'

[[agents.approvals.risk.rule]]
name = "aws delete"
tools = ["Bash"]
pattern = '\baws\b.*\s(delete|remove|terminate|purge)-[a-z0-9-]+\b'

[[agents.approvals.risk.rule]]
name = "s3 rm/rb/mv"
tools = ["Bash"]
pattern = '\baws\b.*\ss3\s+(rm|rb|mv)\b|\baws\b.*\ss3\s+sync\b.*\s--delete\b'

# The navigator opens as one row per pane, ready to type, like the tv picker.
[panes]
navigator_layout = "flat"
navigator_search = true

# herdr: prefix+c opens a tab in the focused pane's folder. A new workspace is
# empty, and this opens its first pane in the folder of the pane you came from.
[workspaces]
new_window_when_empty = true

# Name agent panes after their topic, which the rail otherwise hides behind the
# running command ("claude 1", "claude 2"). The daemon reads [hooks] at start,
# so `tuios restart-server` picks a change up.
[hooks]
after-agent-state = "~/.config/tuios/scripts/auto-name.sh"
# A worktree from prefix+U, `tuios worktree new`, `fan` or the New agent sheet
# gets mise trusted and its tools installed before the first pane starts.
after-new-worktree = "~/.config/tuios/scripts/new-worktree.sh"

# Worktrees sit beside their repo, in a hidden .worktrees folder of the repo's
# parent, so a session in one still loads the CLAUDE.md of ~/CX, ~/CNOPS or
# ~/CN-TERMINAL above it. Outside the repo, so the main checkout never lists it
# as untracked. The daemon rereads this when the file changes.
[worktree]
path = "../.worktrees/{{ repo }}/{{ branch | slug }}"

# Selection in rosewater with base text, as Ghostty's bundled Mocha draws it,
# so a selection looks the same in a tuios pane and in Ghostty. The copy-mode
# cursor is rosewater too, with crust text, as Ghostty's cursor. The theme's
# selection_bg does not reach tuios's own selection, so it stays here.
[appearance.selection]
bg = "#f5e0dc"
fg = "#1e1e2e"
cursor_bg = "#f5e0dc"
cursor_fg = "#11111b"

# herdr's sidebar sits on the left.
[appearance.sidebar]
position = "left"
width = 34
# A repo's main checkout and its worktree sessions sit under one group.
group_main = true

# The shipped row with the context left in place of its context token, which
# counts what is used and draws only from 80%. Fed by Claude Code's status line
# (claude/statusline-command.sh). The model and the cost stay off the row, so
# `now` keeps the room: the Inbox and the peek still show the model.
[appearance.sidebar.agent_row]
tokens = [
  "session",
  "need",
  "harness",
  "name",
  "progress",
  "elapsed",
  "$context",
  "subagents",
  "pr",
  "meta",
  "now",
  "message",
]

[keybindings]
# Option is the us-altgr-intl compose layer, so the characters it types go to
# the pane and never run an alt+ binding.
option_glyphs = "type"

# ctrl+p belongs to fish and Neovim, alt+space to text. The palette stays on
# prefix+P.
[keybindings.global]
command_palette = []
launcher = []
# Cmd+K opens tuios's own pane navigator: every pane in every session,
# searched by name, folder, command and the last 40 screen lines, with a live
# preview. Ghostty sends Cmd+K as super+k once it unbinds it; WezTerm sends
# ctrl+alt+k.
choose_tree = ["super+k", "ctrl+alt+k"]
# Ghostty hands these Cmd chords to tuios (ghostty/config.ghostty unbinds
# them): Cmd+T opens a workspace and Cmd+1..9 picks one, like a tab bar's.
# Cmd+W closes the pane, a command key below. Cmd+R and Cmd+D split right and
# down, as Ghostty's own splits did.
new_workspace = ["super+t"]
split_vertical = ["super+r"]
split_horizontal = ["super+d"]
switch_workspace_1 = ["super+1"]
switch_workspace_2 = ["super+2"]
switch_workspace_3 = ["super+3"]
switch_workspace_4 = ["super+4"]
switch_workspace_5 = ["super+5"]
switch_workspace_6 = ["super+6"]
switch_workspace_7 = ["super+7"]
switch_workspace_8 = ["super+8"]
switch_workspace_9 = ["super+9"]
# Cmd+. labels the panes and focuses the one whose label you type.
display_panes = ["super+."]
# Ctrl+Shift+Space labels the text on every pane of the workspace.
hints_all_panes = ["ctrl+shift+space"]

[keybindings.prefix_mode]
# herdr: prefix+v splits right and prefix+c opens a tab (a tuios workspace).
prefix_split_vertical = ["v", "|", "\\"]
# herdr: prefix+1..9 picks a tab.
switch_workspace_1 = ["1"]
switch_workspace_2 = ["2"]
switch_workspace_3 = ["3"]
switch_workspace_4 = ["4"]
switch_workspace_5 = ["5"]
switch_workspace_6 = ["6"]
switch_workspace_7 = ["7"]
switch_workspace_8 = ["8"]
switch_workspace_9 = ["9"]
prefix_select_0 = []
prefix_select_1 = []
prefix_select_2 = []
prefix_select_3 = []
prefix_select_4 = []
prefix_select_5 = []
prefix_select_6 = []
prefix_select_7 = []
prefix_select_8 = []
prefix_select_9 = []
prefix_review = ["ctrl+v"]
prefix_new_window = []
new_workspace = ["c"]
next_workspace = ["n"]
prev_workspace = ["p"]
prefix_next_window = ["tab"]
prefix_prev_window = ["shift+tab"]
# herdr: prefix+q detaches, prefix+g is Go To, prefix+w picks a workspace.
prefix_detach = ["d", "q"]
prefix_quit = []
choose_tree = ["g", "/"]
toggle_scratch = ["G"]
prefix_session_switcher = ["w"]
prefix_workspace = ["ctrl+w"]
# herdr: prefix+ctrl+n/p step through workspaces, here sessions.
next_session = ["ctrl+n", ")"]
prev_session = ["ctrl+p", "("]
# herdr: prefix+a and prefix+A step through the agents, across sessions, in the
# order of the rail's agents section. J and K are tuios's own keys for it. The
# attention queue keeps o for the oldest item that needs you, and the newest
# finished turn moves from O, which opens the AWS profiles, to ctrl+k.
next_agent = ["a", "J"]
prev_agent = ["A", "K"]
prefix_next_attention = ["o"]
launcher = ["ctrl+a"]
prefix_next_finished = ["ctrl+k"]
prefix_agents_settings = []
clear_scrollback = ["ctrl+l"]
# Freed for the command keys below, which a tuios action would otherwise win.
prefix_layout = ["ctrl+o"]
prefix_tape = []
prefix_toggle_other_rail = []
prefix_file_search = ["ctrl+f"]
prefix_rename_window = ["ctrl+r"]
# herdr: prefix+e opens the pane's screen and scrollback in $EDITOR. The rail
# toggle that had e takes E, the key tuios gives the editor.
edit_scrollback = ["e"]
prefix_explore = ["E"]
# herdr: prefix+F opens the F1 dashboard, a command key below. The text hints
# that had F move to ctrl+u.
hints = ["ctrl+u"]
# Labels on every pane of the workspace, not just the focused one: alt and
# the single-pane key. Y is the yazi file picker's, ctrl+y the last message.
hints_all_panes = ["alt+u"]

# herdr's capital letters: prefix+shift+x closes a tab and shift+t renames it,
# shift+n makes a workspace (here a session), shift+d closes it and shift+w
# renames it. tuios's own owners of those keys move: the debug prefix to
# ctrl+d, the window prefix to ctrl+x, the last message to ctrl+y and the
# workspace switcher to ctrl+g.
close_workspace = ["X"]
rename_workspace = ["T"]
new_session = ["N"]
prefix_close_session = ["D"]
# prefix+x is the close-pane command key below, which also ends a session it
# leaves empty.
prefix_close_window = []
rename_session = ["W"]
prefix_debug = ["ctrl+d"]
prefix_window = ["ctrl+x"]
prefix_last_message = ["ctrl+y"]
prefix_workspace_switcher = ["ctrl+g"]

# Like herdr, nothing but the prefix and the command keys below is taken from
# the pane. Focus moves on ctrl+hjkl, windows and tabs on the prefix.
[keybindings.terminal_mode]
terminal_exit_mode = []
terminal_focus_left = []
terminal_focus_down = []
terminal_focus_up = []
terminal_focus_right = []
terminal_next_window = []
terminal_prev_window = []

[keybindings.workspaces]
switch_workspace_1 = []
switch_workspace_2 = []
switch_workspace_3 = []
switch_workspace_4 = []
switch_workspace_5 = []
switch_workspace_6 = []
switch_workspace_7 = []
switch_workspace_8 = []
switch_workspace_9 = []
move_and_follow_1 = []
move_and_follow_2 = []
move_and_follow_3 = []
move_and_follow_4 = []
move_and_follow_5 = []
move_and_follow_6 = []
move_and_follow_7 = []
move_and_follow_8 = []
move_and_follow_9 = []
send_to_workspace_1 = []
send_to_workspace_2 = []
send_to_workspace_3 = []
send_to_workspace_4 = []
send_to_workspace_5 = []
send_to_workspace_6 = []
send_to_workspace_7 = []
send_to_workspace_8 = []
send_to_workspace_9 = []

[keybindings.window_management]
next_session = []
prev_session = []

# herdr-splits: ctrl+hjkl moves and ctrl+shift+hjkl resizes across panes and
# Neovim windows. It runs unchanged through the herdr compat API, once enabled
# from a terminal outside tuios: `tuios plugins enable herdr-splits`.
[[keybindings.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keybindings.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keybindings.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keybindings.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keybindings.command]]
key = "ctrl+shift+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keybindings.command]]
key = "ctrl+shift+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keybindings.command]]
key = "ctrl+shift+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keybindings.command]]
key = "ctrl+shift+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

# Popups and pickers, opened by scripts/toggle-popup.sh in the directory of the
# pane the key was pressed in. The tv pane picker stays on prefix+f for its
# attention order, scopes and scrollback/recap/log previews.
[[keybindings.command]]
key = "prefix+f"
name = "pane-picker"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh pane-picker 90% 80% -- ~/.config/tuios/scripts/close-on-leave.sh tv tuios-sessions"
description = "Pane picker"

[[keybindings.command]]
key = "prefix+l"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh lazygit 80% 60% -- ~/.config/tuios/scripts/lazygit-popup.sh status"
description = "lazygit: status"

[[keybindings.command]]
key = "prefix+L"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh lazygit 80% 60% -- ~/.config/tuios/scripts/lazygit-popup.sh log"
description = "lazygit: log"

[[keybindings.command]]
key = "prefix+y"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh yazi 80% 60% -- ~/.config/tuios/scripts/yazi-popup.sh"
description = "yazi: browse"

[[keybindings.command]]
key = "prefix+Y"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh yazi 80% 60% -- ~/.config/tuios/scripts/yazi-popup.sh pick"
description = "yazi: pick files into pane"

# Close the pane. On a session's last pane, close the session too and show the
# next one, rather than leave the session empty on its splash screen.
[[keybindings.command]]
key = "prefix+x"
type = "shell"
command = "~/.config/tuios/scripts/close-pane.sh"
description = "Close pane, and the session with its last one"

[[keybindings.command]]
key = "super+w"
name = "close-pane-cmd-w"
type = "shell"
command = "~/.config/tuios/scripts/close-pane.sh"
description = "Close pane, and the session with its last one"

# Enter opens or focuses a session for the repo.
[[keybindings.command]]
key = "prefix+r"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh repo-picker 90% 60% -- ~/.config/tuios/scripts/close-on-leave.sh tv git-repos"
description = "Git repo picker"

[[keybindings.command]]
key = "prefix+H"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh hotkeys 90% 60% -- ~/.config/tuios/scripts/close-on-leave.sh tv hotkeys"
description = "Hotkeys"

[[keybindings.command]]
key = "prefix+O"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh aws-profiles 80% 60% -- ~/.config/tuios/scripts/close-on-leave.sh tv aws-profiles"
description = "AWS profiles"

# tsk board, as a popup so opening it does not retile the agent panes. A popup
# starts in the daemon's directory, so it changes to the pane's first: tsk
# scopes the board to that repo. Quick capture is a popup the same way, 80x15
# like herdr-tsk's; a save or a discard exits it.
[[keybindings.command]]
key = "prefix+t"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh tsk-board -- bash -c 'cd \"$TUIOS_ACTIVE_PANE_CWD\" && exec tsk'"
description = "Toggle tsk board"

[[keybindings.command]]
key = "prefix+ctrl+t"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh tsk-capture 82 17 -- bash -c 'cd \"$TUIOS_ACTIVE_PANE_CWD\" && exec tsk capture'"
description = "tsk quick capture"

[[keybindings.command]]
key = "prefix+ctrl+e"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh tsk-notes 80% 60% -- ~/.config/tuios/scripts/tsk-notes.sh"
description = "Edit tsk notes in nvim"

# Hand the tsk task under the board cursor to a new Claude agent, through a
# tuios task card: here in the repo's folder, or in a worktree of its own.
# tsk keeps the plan and the notes; the card follows the run (plan, verify,
# PR) on the agents view's board (prefix+i, then b).
[[keybindings.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "~/.config/tuios/scripts/tsk-dispatch.sh here"
description = "tsk: start agent on task (here)"

[[keybindings.command]]
key = "prefix+S"
type = "shell"
command = "~/.config/tuios/scripts/tsk-dispatch.sh worktree"
description = "tsk: start agent on task (worktree)"

# Subagent viewers for the Claude pane the key is pressed in, through
# scripts/subagents.sh and claude/hooks/subagent-viewer.sh. prefix+h peeks at
# them in a popup, one tagged stream for all; prefix+ctrl+j opens a workspace
# with a pane per subagent, focuses it, or closes it from inside. The rail's
# subagent rows say what each one runs now; these show the whole stream.
[[keybindings.command]]
key = "prefix+h"
type = "shell"
command = "~/.config/tuios/scripts/toggle-popup.sh subagents 90% 80% -- ~/.config/tuios/scripts/subagents.sh stream"
description = "Subagents: popup stream"

[[keybindings.command]]
key = "prefix+ctrl+j"
type = "shell"
command = "~/.config/tuios/scripts/subagents.sh toggle"
description = "Subagents: viewer workspace"

# F1 dashboard, through the herdr-f1 plugin (`herdr plugin install
# hmu332233/herdr-f1`; tuios reads herdr's registry and leaves it off until it is
# enabled below).
[[keybindings.command]]
key = "prefix+F"
type = "plugin_action"
command = "dev.minung.herdr-f1.open"
description = "Open F1 dashboard"

[hints]
# The home row without g: with g a label letter, Ctrl+G opens label g instead
# of closing hints mode.
alphabet = "asdfhjkl"

[plugins]
enabled = ["herdr-splits", "dev.minung.herdr-f1", "herdr-automatic-rename"]

# Push notifications ([notify]) live in config.d/notify.toml, which is
# gitignored because an ntfy topic address is a secret. Copy
# config.d/notify.toml.example and run `tuios config apply` and
# `tuios notify test` from a terminal outside tuios.

[spotlight]
enabled = false
