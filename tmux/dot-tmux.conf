# tmux configuration

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g mouse on

# ---------------------------------------------------------------------------
# Prefix: Ctrl+Space
# ---------------------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# Status bar (Catppuccin Mocha colors, bottom)
# ---------------------------------------------------------------------------

set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#6c7086] %H:%M "
set -g status-left-length 30
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W "
set -g window-status-style "fg=#6c7086"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"

# ---------------------------------------------------------------------------
# Splits and windows
# ---------------------------------------------------------------------------

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane navigation — Ctrl+hjkl, shared with neovim via smart-splits.nvim
# The plugin provides a script that checks if nvim is focused before deciding
# whether to pass the key to nvim or move the tmux pane.
# ---------------------------------------------------------------------------

# @pane-is-vim is set/unset by smart-splits.nvim automatically
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"

# ---------------------------------------------------------------------------
# Copy mode — vi keys
# ---------------------------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode

bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r     send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Search in scrollback (prefix + /)
bind / copy-mode \; send-keys -X search-backward ""

# ---------------------------------------------------------------------------
# URL hints — prefix + o (tmux-fzf-url)
# ---------------------------------------------------------------------------

bind o run-shell "~/.tmux/plugins/tmux-fzf-url/fzf-url.sh"

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------

bind -n M-Tab switch-client -n
bind 9 choose-session

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display "Config reloaded!"

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


# URL hints
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-w 50% -h 50% --multi -0 --no-preview'
set -g @fzf-url-extra-filter 'grep -oE "ext\+container:[^ ]+"'

run '~/.tmux/plugins/tpm/tpm'
