# Maintenance tasks for this repo. Deliberately not in the global mise config:
# keeping them here means `update` can never collide with a task of the same
# name in another project, and it only resolves when mise is pointed at this
# directory — `mise run update` from inside the repo, `mise -C ~/dotfiles run
# update` from anywhere else.
#
# No [tools] section on purpose. The tools are declared in the global config,
# which the `mise` dotfile group below links to ~/.config/mise/config.toml; this
# file holds the maintenance tasks and the dotfile declarations.
#
# Two cadences. `update` is the daily one: cheap, low blast radius, safe to run
# unattended. `update:weekly` adds the work that is bandwidth-heavy, deletes
# things, or rewrites tracked files — none of which pays for itself daily.

[tasks."update:brew"]
description = "Upgrade homebrew formulae"
run = [
  "brew update",
  "brew upgrade",
]

[tasks."update:brew-weekly"]
description = "Refresh casks and reclaim homebrew disk space"
# Homebrew allows one process at a time; without this it races update:brew.
depends = ["update:brew"]
# --greedy bypasses the "already latest" short-circuit for casks that carry
# their own updater — most of the ones here (browsers, Slack, Spotify,
# 1Password) self-update, so a daily greedy pass re-downloads full installers
# to arrive where they already were. --prune=all drops homebrew's 120-day
# cache grace, so it belongs on the same slower cadence.
run = [
  "brew upgrade --cask --greedy",
  "brew cleanup --prune=all",
]

[tasks."update:mise"]
description = "Upgrade mise tools and refresh mise.lock"
# $HOME, so the global config is the active config root. Left in this repo the
# config root would be this file, which declares no tools at all.
dir = "{{env.HOME}}"
# No --minimum-release-age override: mise's 24h default is the point. Nearly
# every tool in the global config is "latest", so a same-day release would go
# straight onto ~100 tools unattended. Waiting a day lets a yanked or broken
# release be caught first, and costs nothing at this cadence — the next run
# picks it up.
run = [
  "mise upgrade",
  # `mise upgrade` only records the platform it ran on; `mise lock --global`
  # refreshes checksums and URLs for everything else in mise.lock. Without
  # --platform it locks every platform family the lockfile already mentions,
  # so a lockfile that once saw linux or windows keeps carrying them. This
  # machine set is macOS on Apple silicon only.
  "mise lock --global --platform macos-arm64",
]

[tasks."update:mise-prune"]
description = "Reclaim mise disk space"
dir = "{{env.HOME}}"
depends = ["update:mise"]
# Kept out of update:mise on purpose: pruning immediately after an upgrade
# deletes the last known-good version of every tool that just moved, so a bad
# "latest" leaves nothing to fall back to.
run = "mise prune --yes"

[tasks."update:skills"]
description = "Upgrade global agent skills"
# The lockfile this rewrites is linked from skills/dot-skill-lock.json, so an
# upgraded skill shows up in the `update` task's closing git status. The CLI
# writes the lock in place rather than by rename, which is what keeps the
# symlink intact across runs.
run = "npx -y skills@latest update --global --yes"

[tasks."update:herdr-plugins"]
description = "Upgrade herdr plugins installed from GitHub"
# herdr keeps its plugin registry in ~/.config/herdr/plugins.json, next to
# absolute install paths and timestamps, so it cannot be linked from here.
# herdr/plugins.lock.json is a snapshot of just the source and commit of each
# plugin, so an upgraded plugin shows up in the `update` task's closing git
# status. Local plugins are listed without a commit: bulk update skips them.
# The herdr CLI needs a real herdr server. Rex and tuios panes also set
# HERDR_ENV=1 without one, so those are told apart by REX_SESSION and TUIOS_ENV.
run = """
if [ "${HERDR_ENV:-}" != 1 ] || [ -n "${REX_SESSION:-}" ] || [ -n "${TUIOS_ENV:-}" ]; then
  echo "not inside herdr, skipping"
  exit 0
fi
herdr plugin update --yes
herdr plugin list --json | jq '[.result.plugins[] | {id: .plugin_id, enabled, source: (if .source.kind == "github" then "\\(.source.owner)/\\(.source.repo)" else .source.kind end), commit: .source.resolved_commit}] | sort_by(.id)' > herdr/plugins.lock.json
"""

[tasks."update:yazi"]
description = "Upgrade yazi plugins and flavors"
run = "ya pkg upgrade"

[tasks."update:nvim"]
description = "Sync lazy.nvim plugins, upgrade mason packages and treesitter parsers"
run = [
  "nvim --headless '+Lazy! sync' +qa",
  "nvim --headless '+luafile {{config_root}}/lazyvim/headless-update.lua'",
]

[tasks."update:nvim-nightly"]
description = "Reinstall the neovim nightly build behind the nvn alias"
# Not in `update`: nightly is opt-in. --force because "nightly" is a fixed
# version name, so mise otherwise treats an existing install as current.
# Skipped when the installed build already carries the nightly tag's commit.
run = """
set -euo pipefail
nvim="$HOME/.local/share/mise/installs/neovim/nightly/bin/nvim"
sha=$(git ls-remote https://github.com/neovim/neovim refs/tags/nightly | cut -c1-7)
if [ -x "$nvim" ] && "$nvim" --version | grep -q "+g$sha"; then
  echo "neovim nightly is already at $sha"
  exit 0
fi
mise install --force neovim@nightly
"""

[tasks."update:tuios-nightly"]
description = "Build tuios from main and link it as tuios in ~/.local/bin"
# Not in `update`: nightly is opt-in. tuios is not a mise tool: `restart-server`
# starts the newer of the binary you ran and the one on PATH, and judges a dev
# build older than any release, so a mise-managed release on PATH would win.
# --keep-server leaves a running daemon on the previous build; `tuios
# kill-server` switches over when the panes can be spared. The ghostty backend
# links libghostty-vt, which needs the zig series ghostty pins (ZIG_SERIES in
# scripts/ghostty-lib.sh); the library is built once and cached in the checkout.
# Every host in tuios's [hosts] table gets the same commit, cross-built from
# this clone; their daemons stay on the old build until
# `tuios hosts sync NAME --restart`.
tools = { go = "latest", zig = "0.17" }
run = """
set -euo pipefail
root="$HOME/.local/share/tuios-nightly"
src="$root/src"
# An unreachable host (tailnet down, Pi asleep) only warns: the local build
# still counts as done.
sync_hosts() {
  local out ok=0
  out=$(tuios hosts sync --dev --src "$src" --json 2>/dev/null) && ok=1
  jq -r '.hosts[] | select(.action != "failed")
    | "\\(.host): \\(.action)", (.notes // [] | .[] | "  \\(.)")' <<<"$out" 2>/dev/null || true
  [ "$ok" = 1 ] && return
  jq -r '.hosts[] | select(.action == "failed")
    | "warning: tuios not synced to \\(.host): \\(.error)"' <<<"$out" >&2 2>/dev/null ||
    echo "warning: tuios host sync failed" >&2
  echo "warning: rerun with: tuios hosts sync --dev --src $src" >&2
}
if [ -d "$src/.git" ]; then
  built=$(git -C "$src" rev-parse HEAD)
  git -C "$src" fetch --depth 1 origin main
  git -C "$src" reset --hard FETCH_HEAD
  if [ -x "$root/bin/tuios" ] && [ "$built" = "$(git -C "$src" rev-parse HEAD)" ] \
    && [ "$(cat "$root/built-commit" 2>/dev/null)" = "$built ghostty" ]; then
    echo "tuios is already at ${built:0:7}"
    sync_hosts
    exit 0
  fi
else
  mkdir -p "$root"
  git clone --depth 1 https://github.com/Gaurav-Gosain/tuios.git "$src"
fi
"$src/scripts/install.sh" ghostty --prefix "$root/bin" --keep-server
echo "$(git -C "$src" rev-parse HEAD) ghostty" > "$root/built-commit"
ln -sfn "$root/bin/tuios" "$HOME/.local/bin/tuios"
sync_hosts
"""

[tasks."update:tv-nightly"]
description = "Reinstall television from the tip of main"
# Not in `update`: nightly is opt-in. television is a mise tool on the cargo
# backend's `branch:main` version, which mise treats as installed once it is
# there, so --force rebuilds it. Skipped when the installed build already is
# main's tip. main carries the kitty keyboard protocol, so alt+enter and
# ctrl+enter reach tv inside tuios. The first run on 0.16 migrates
# ~/.config/television/config.toml and leaves a config.toml.0.15.bak beside it.
run = """
set -euo pipefail
tool="cargo:alexpasmantier/television@branch:main"
sha=$(git ls-remote https://github.com/alexpasmantier/television refs/heads/main | cut -f1)
dir=$(mise where "$tool" 2>/dev/null || true)
if [ -n "$dir" ] && grep -q "$sha" "$dir/.crates.toml" 2>/dev/null; then
  echo "tv is already at ${sha:0:7}"
  exit 0
fi
mise install --force "$tool"
mise exec "$tool" -- tv --version
"""

[tasks."update:herdr-nightly"]
description = "Install the newest herdr preview build behind the herdrn alias"
# Not in `update`: nightly is opt-in. herdr publishes prebuilt preview builds
# as prereleases, which mise's github backend installs by tag without
# activating them, next to the aqua release that `herdr` runs. The tag is
# pinned in mise-global/config.toml so mise sees the install as configured;
# stable stays first on PATH. The nightly symlink gives the herdrn alias one
# path. Preview builds can lag the latest stable tag; the tag is printed. The running server stays on its old build
# until `herdrn server stop`.
run = """
set -euo pipefail
root="$HOME/.local/share/mise/installs/github-herdrdev-herdr"
tag=$(mise ls-remote --prerelease github:herdrdev/herdr | grep '^preview-' | tail -1)
[ -n "$tag" ] || { echo "no herdr preview build found" >&2; exit 1; }
mise install "github:herdrdev/herdr@$tag"
sd '"github:herdrdev/herdr" = "[^"]*"' '"github:herdrdev/herdr" = "'"$tag"'"' "$HOME/dotfiles/mise-global/config.toml"
mise lock --global
ln -sfn "./$tag" "$root/nightly"
"$root/nightly/herdr" --version
"""

[tasks."update:manifests"]
description = "Rewrite the homebrew manifests this repo tracks"
# Weekly, not daily: these two files are rewritten on every run, and most of
# the resulting diff is transitive dependency version bumps rather than a
# package this repo chose to track. Daily it is a permanently dirty worktree
# for almost no signal.
depends = ["update:brew", "update:brew-weekly"]
run = [
  "brew bundle dump --global --force --formula --cask --tap",
  "brew list --versions | sort > homebrew/Brewfile.versions",
]

[tasks."sync:claude-mcp"]
description = "Merge claude/mcp-servers.json into the user-scope MCP servers in ~/.claude.json"
# ~/.claude.json also holds session history and OAuth state, so it cannot be
# linked from here. Declared servers overwrite same-named entries; servers
# added by hand stay. $HOME in the JSON is expanded here, not by Claude Code.
# Written via a temp file and rename so a running session never reads half a file.
run = """
set -euo pipefail
target="$HOME/.claude.json"
tmp="$(mktemp "$target.XXXXXX")"
jq --arg home "$HOME" --slurpfile servers '{{config_root}}/claude/mcp-servers.json' \
  '.mcpServers = ((.mcpServers // {}) + ($servers[0] | walk(if type == "string" then gsub("\\\\$HOME"; $home) else . end)))' \
  "$target" > "$tmp"
chmod 600 "$tmp"
mv "$tmp" "$target"
"""

[tasks."claude:explain-hooks"]
description = "Show which commands the agent hooks and permission rules allow, ask about or deny, in a tuios pane"
# The counts and tables in the document are written by hand: update them when
# settings.json or a hook's tables change. Reformat after editing with
# XMLLINT_INDENT='  ' xmllint --format FILE, then drop the <?xml?> line it adds.
run = "tuios tml show {{config_root}}/claude/hooks/overview.tml --pane"

[tasks."nono:gen-aws"]
description = "Regenerate the sandbox AWS config and nono's SigV4 routes from aws/config"
run = "python3 -I {{config_root}}/nono/tools/gen-aws.py"

[tasks."nono:battle-aws"]
description = "Battle test AWS inside the agent sandbox: [PROFILE] [BUCKET] [--interactive]"
# Read-only: writes are aimed at resources that do not exist. Extra arguments
# go to the script. Then `nono audit show <id>` lists each proxy decision.
run = "nono run --silent --profile liflig-base -- bash {{config_root}}/nono/battle/aws.sh"

[tasks."nono:gen-github"]
description = "Regenerate the agents' gh access from nono/github-repos.txt"
run = "python3 -I {{config_root}}/nono/tools/gen-github.py"

[tasks."nono:probe"]
description = "Run the sandbox and docs probes that need no human; PASS/FAIL per probe ID"
run = "bash {{config_root}}/nono/battle/probe.sh"

[tasks."nono:keychain"]
description = "Copy the agents' brokered credentials from fnox into the keychain items nono reads"
# nono resolves credential_key names from the login keychain, service "nono",
# on the host when a session starts; the sandbox never reads the keychain. Run
# again after rotating a token. github_packages is the classic PAT with
# read:packages only, which fnox does not hold; pass it as NONO_GITHUB_PACKAGES.
run = """
set -eu
put() { security add-generic-password -U -s nono -a "$1" -w "$2"; echo "nono/$1 stored"; }
pat="$(fnox get GITHUB_PERSONAL_ACCESS_TOKEN)"
put github_pat_basic "x-access-token:$pat"
put github_pat "$pat"
put github_public "$(fnox get MISE_GITHUB_TOKEN)"
put nexus_basic "$(id -un):$(fnox get NEXUS_PASSWORD)"
put context7 "$(fnox get CONTEXT7_API_KEY)"
put exa "$(fnox get EXA_API_KEY)"
if [ -n "${NONO_GITHUB_PACKAGES:-}" ]; then
  put github_packages "$NONO_GITHUB_PACKAGES"
else
  echo "nono/github_packages not changed: set NONO_GITHUB_PACKAGES to a read:packages PAT"
fi
"""

[tasks."nono:java-truststore"]
description = "Build the JDK truststore that lets Maven in nono trust nono's CA"
# The liflig-base profile keeps one CA (CN=nono-proxy-ca) in your macOS trust
# store for a year (tls_intercept.ca_lifecycle = "trusted"). The JVM reads
# neither that store nor SSL_CERT_FILE, so MAVEN_OPTS points it at a copy of the
# JDK's roots with that CA added. A short nono run creates the CA the first
# time (a Touch ID prompt). Run again when nono rotates it, once a year.
run = """
set -eu
nono run --profile liflig-base -- true
work="$(mktemp -d)"
security find-certificate -c nono-proxy-ca -p >"$work/ca.pem"
java_home="$(mise where java)"
keytool -importkeystore -noprompt \
  -srckeystore "$java_home/lib/security/cacerts" -srcstorepass changeit \
  -destkeystore "$work/truststore.p12" -deststoretype PKCS12 -deststorepass changeit >/dev/null
keytool -importcert -noprompt -alias nono-proxy-ca -file "$work/ca.pem" \
  -keystore "$work/truststore.p12" -storepass changeit
mkdir -p "$HOME/.local/share/nono-agent"
mv "$work/truststore.p12" "$HOME/.local/share/nono-agent/java-truststore.p12"
echo "truststore: $HOME/.local/share/nono-agent/java-truststore.p12"
"""

[tasks."sync:nono-approvals"]
description = "(Re)load the LaunchAgent that answers nono's approval requests in tuios"
run = """
set -euo pipefail
plist="$HOME/Library/LaunchAgents/com.jonasws.nono-approvals.plist"
[[ -e $plist ]] || { echo "$plist is missing: run 'mise dotfiles apply' first" >&2; exit 1; }
mkdir -p "$HOME/.local/state/nono-approvals"
launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
"""

[tasks."lima:agents"]
description = "Create or start the agents' Docker VM (rootless, read-only repo mounts)"
# limactl start takes a template path only when it creates the instance.
run = """
if limactl list -q | grep -qx agents; then
  limactl start agents
else
  limactl start --name=agents --tty=false '{{config_root}}/lima/agents.yaml'
fi
"""

[tasks."sync:lima-agents"]
description = "(Re)load the LaunchAgent that starts the agents' Docker VM at login"
run = """
set -euo pipefail
plist="$HOME/Library/LaunchAgents/com.jonasws.lima-agents.plist"
[[ -e $plist ]] || { echo "$plist is missing: run 'mise dotfiles apply' first" >&2; exit 1; }
mkdir -p "$HOME/.local/state/lima-agents"
launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
"""

[tasks."claude:explain-sandbox"]
description = "Show the agent fleet sandbox design (nono, tuios, Docker, Maven, AWS) in a tuios pane"
run = "tuios tml show {{config_root}}/docs/agent-fleet-sandbox.tml --pane"

[tasks."sync:rex-herdr"]
description = "(Re)load the herdr socket server's LaunchAgent"
# bootout fails when the agent is not loaded yet, which is fine.
run = """
set -euo pipefail
plist="$HOME/Library/LaunchAgents/com.jonasws.rex-herdr.plist"
[[ -e $plist ]] || { echo "$plist is missing: run 'mise dotfiles apply' first" >&2; exit 1; }
launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
"""

[tasks."sync:tsk-card-sync"]
description = "(Re)load the LaunchAgent that moves tsk tasks to review from their tuios cards"
# bootout fails when the agent is not loaded yet, which is fine.
run = """
set -euo pipefail
plist="$HOME/Library/LaunchAgents/com.jonasws.tsk-card-sync.plist"
[[ -e $plist ]] || { echo "$plist is missing: run 'mise dotfiles apply' first" >&2; exit 1; }
mkdir -p "$HOME/.local/state/tsk-card-sync"
launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
"""

[tasks."keychron:apply"]
description = "Load keychron/q1-max.vil into the Keychron Q1 Max (Vial firmware) with vitaly"
# The keyboard must be unlocked first: `vitaly -i 2064 lock -u` while holding
# Esc and Enter. Save changes made in Pipette back with keychron:save.
# The .vil file holds no lighting, so the backlight is set here: Direct
# Control with only Esc (LED 0) lit in purple. The effect persists on the
# keyboard; the per-LED colours may not, so keychron:light reapplies them.
run = [
  "vitaly -i 2064 load -f {{config_root}}/keychron/q1-max.vil",
  { task = "keychron:light" },
]

[tasks."keychron:light"]
description = "Backlight off on the Keychron Q1 Max except Esc, in purple"
run = [
  "vitaly -i 2064 rgb -e 1 -b 255 -p",
  "vitaly -i 2064 rgb -d '0=#6a00ff;1-80=#000000'",
]

[tasks."keychron:save"]
description = "Save the Keychron Q1 Max's current Vial config to keychron/q1-max.vil"
run = "vitaly -i 2064 save -f {{config_root}}/keychron/q1-max.vil"

[tasks."sync:karabiner"]
description = "Generate karabiner.json from karabiner-ts and copy it to ~/.config/karabiner"
dir = "{{config_root}}/karabiner-ts"
# Pinned to the minor series so a new bun major cannot change the output; the
# global `bun = "latest"` is not what this task runs on.
tools = { bun = "1.4" }
# Karabiner replaces a symlinked karabiner.json when it saves, so the live file
# is a copy. The previous one is kept next to it as karabiner.json.pre-sync.bak.
# Only the complex_modifications rules are generated; the devices block is
# whatever the repo copy holds.
run = """
set -euo pipefail
bun install --frozen-lockfile
bun karabiner.config.ts
src='{{config_root}}/karabiner/.config/karabiner/karabiner.json'
dst="$HOME/.config/karabiner/karabiner.json"
jq empty "$src"
if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
  echo "karabiner.json is up to date"
  exit 0
fi
mkdir -p "$(dirname "$dst")"
[ -f "$dst" ] && cp "$dst" "$dst.pre-sync.bak"
tmp="$(mktemp "$dst.XXXXXX")"
cp "$src" "$tmp"
chmod 600 "$tmp"
mv "$tmp" "$dst"
echo "karabiner.json synced"
"""

[tasks.update]
description = "Daily upgrade, then show what changed"
depends = ["update:brew", "update:mise", "update:skills", "update:herdr-plugins", "update:yazi", "update:nvim"]
run = "git status --short"

[tasks."update:weekly"]
description = "Everything in `update`, plus casks, pruning and manifests"
depends = ["update", "update:brew-weekly", "update:mise-prune", "update:manifests"]
# `update` prints its own status before the manifests are rewritten; this is
# the one that reflects the finished run.
run = "git status --short"

# ── Dotfiles ────────────────────────────────────────────────────────────────
# `mise -C ~/dotfiles dot apply` deploys this repo into $HOME. One group per
# application: its directory holds that application's config as it appears on
# disk, and `target` says where. Groups link each file (`symlink-each`) unless
# they say `mode = "symlink"`, which links the directory itself — needed where
# the application writes back into its own config directory (lazy-lock.json,
# yazi's package.toml), so those writes land in the repo.
#
# Files that live directly in $HOME are named `dot-<name>` here and deploy as
# `.<name>` (`dot_prefix`), so nothing in the repo is hidden from tv or yazi.

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true

# Atuin reads ~/.atuin/config.toml whenever it exists, and then ignores
# ~/.config/atuin. Its onboarding writes a default one there.
[dotfile_groups.atuin]
root = "atuin"
target = "~/.atuin"

[dotfile_groups.aws]
root = "aws"
target = "~/.aws"

[dotfile_groups.bash]
root = "bash"
target = "~"

[dotfile_groups.bat]
root = "bat"
target = "~/.config/bat"

[dotfile_groups.claude]
root = "claude"
target = "~/.claude"
# Read by sync:claude-mcp, not by Claude Code.
exclude = ["mcp-servers.json"]

# ~/.claude/skills also holds skills installed from elsewhere, so each skill
# kept here is linked on its own rather than the whole directory.
[dotfile_groups.claude.entries]
"~/.claude/themes" = { mode = "symlink" }
"~/.claude/hooks/decision-recorder" = { mode = "symlink" }
"~/.claude/skills/brainstorming" = { mode = "symlink" }
"~/.claude/skills/dispatching-parallel-agents" = { mode = "symlink" }
"~/.claude/skills/draft-pane" = { mode = "symlink" }
"~/.claude/skills/find-docs" = { mode = "symlink" }
"~/.claude/skills/maven-kotlin-builds" = { mode = "symlink" }
"~/.claude/skills/sibling-api-docs" = { mode = "symlink" }
"~/.claude/skills/slide-show" = { mode = "symlink" }
"~/.claude/skills/systematic-debugging" = { mode = "symlink" }
"~/.claude/skills/tasks" = { mode = "symlink" }
"~/.claude/skills/test-driven-development" = { mode = "symlink" }

[dotfile_groups.colima]
root = "colima"
target = "~/.config/colima"
# colima rewrites default/colima.yaml on every start; only the template is ours.
exclude = ["default", "sh.brew.colima.plist"]

[dotfile_groups.fish]
root = "fish"
target = "~/.config/fish"
exclude = ["README.md"]

[dotfile_groups.firefox]
root = "firefox"
target = "~/.local/bin"
mode = "symlink-each"

[dotfile_groups.fnox]
root = "fnox"
target = "~/.config/fnox"
exclude = ["README.md"]

[dotfile_groups.fnox-trees]
root = "fnox-trees"

[dotfile_groups.gh-dash]
root = "gh-dash"
target = "~/.config/gh-dash"

[dotfile_groups.ghostty]
root = "ghostty"
target = "~/.config/ghostty"
mode = "symlink"

[dotfile_groups.git]
root = "git"
target = "~/.config/git"
exclude = ["README.md"]

[dotfile_groups.git.entries]
"~/.config/git/template" = { mode = "symlink" }
"~/.config/git/hooks" = { mode = "symlink" }

[dotfile_groups.herdr]
root = "herdr"
target = "~/.config/herdr"
exclude = ["automatic-rename"]

[dotfile_groups.homebrew]
root = "homebrew"
target = "~/.config/homebrew"

[dotfile_groups.hunk]
root = "hunk"
target = "~/.config/hunk"

[dotfile_groups.intellij]
root = "intellij"
dot_prefix = true

[dotfile_groups.lazygit]
root = "lazygit"
target = "~/.config/jesseduffield/lazygit"

[dotfile_groups.lazyjira]
root = "lazyjira"
target = "~/.config/lazyjira"

[dotfile_groups.lazyvim]
root = "lazyvim"
target = "~/.config/nvim"
mode = "symlink"

[dotfile_groups.leaf]
root = "leaf"
target = "~/.config/leaf"

[dotfile_groups.lnav]
root = "lnav"
target = "~/.config/lnav"

[dotfile_groups.maven]
# Only settings.xml: ~/.m2 also holds the local repository.
root = "maven"
target = "~/.m2"

[dotfile_groups.mdcat]
root = "mdcat"
target = "~/.config/mdcat"
mode = "symlink"

[dotfile_groups.mise]
# Not `mise/`: mise reads <project>/mise/config.toml as project config, which
# would load the global config a second time whenever it runs in this repo.
root = "mise-global"
target = "~/.config/mise"

[dotfile_groups.nono]
root = "nono"
target = "~/.config/nono"
mode = "symlink"

[dotfile_groups.nushell]
root = "nushell"
target = "~/.config/nushell"
exclude = ["functions"]

[dotfile_groups.otree]
root = "otree"
target = "~/.config"

[dotfile_groups.presenterm]
root = "presenterm"
target = "~/.config/presenterm"
mode = "symlink"

[dotfile_groups.rex]
root = "rex"
target = "~/.config/rex"
exclude = ["README.md", "herdr/test", "launchd"]

# The herdr socket server's LaunchAgent; see rex/herdr/serve.
[dotfile_groups.rex-launchd]
root = "rex/launchd"
target = "~/Library/LaunchAgents"

# The bridge that answers nono's approval requests in tuios; see
# nono/approvals/bridge.py.
[dotfile_groups.nono-launchd]
root = "nono/approvals"
target = "~/Library/LaunchAgents"
exclude = ["bridge.py"]

[dotfile_groups.ripgrep]
root = "ripgrep"
dot_prefix = true

[dotfile_groups.skills]
root = "skills"
target = "~/.agents"
dot_prefix = true

[dotfile_groups.starship]
root = "starship"
target = "~/.config"

[dotfile_groups.superfile]
root = "superfile"
target = "~/.config/superfile"
mode = "symlink"

[dotfile_groups.tabiew]
root = "tabiew"
target = "~/.config/tabiew"
mode = "symlink"

[dotfile_groups.television]
root = "television"
target = "~/.config/television"
mode = "symlink"

[dotfile_groups.tig]
root = "tig"
dot_prefix = true

[dotfile_groups.tmux]
root = "tmux"
dot_prefix = true

[dotfile_groups.tridactyl]
root = "tridactyl"
target = "~/.config/tridactyl"
mode = "symlink"

[dotfile_groups.tuicr]
root = "tuicr"
target = "~/.config/tuicr"
mode = "symlink"

[dotfile_groups.tuios]
# The whole directory: the keybind manager and `tuios config` rewrite
# config.toml, and plugins.lock and themes/ are written next to it.
root = "tuios"
target = "~/.config/tuios"
mode = "symlink"
exclude = ["README.md", "launchd"]

# Starts the agents' Docker VM at login; see lima/agents.yaml.
[dotfile_groups.lima-launchd]
root = "lima/launchd"
target = "~/Library/LaunchAgents"

# The tsk card sync's LaunchAgent; see tuios/scripts/tsk-card-sync.sh.
[dotfile_groups.tuios-launchd]
root = "tuios/launchd"
target = "~/Library/LaunchAgents"

[dotfile_groups.wezterm]
root = "wezterm"
dot_prefix = true

[dotfile_groups.yazi]
root = "yazi"
target = "~/.config/yazi"
mode = "symlink"

[dotfile_groups.zed]
root = "zed"
target = "~/.config/zed"

[dotfile_groups.zellij]
root = "zellij"
target = "~/.config/zellij"
mode = "symlink"

# Directories that sit beside a group's target rather than inside it.
[dotfiles]
"~/.local/bin/resign-commits" = { source = "bin/resign-commits", mode = "symlink" }
"~/.local/bin/aws-scoped-credentials" = { source = "bin/aws-scoped-credentials", mode = "symlink" }
"~/.config/herdr-automatic-rename" = { source = "herdr/automatic-rename", mode = "symlink" }
