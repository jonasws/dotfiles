# Maintenance tasks for this repo. Deliberately not in the global mise config:
# keeping them here means `update` can never collide with a task of the same
# name in another project, and it only resolves when mise is pointed at this
# directory — `mise run update` from inside the repo, `mise -C ~/dotfiles run
# update` from anywhere else.
#
# No [tools] section on purpose. The tools are declared in the global config,
# which the `mise` dotfile group below links to ~/.config/mise/config.toml; this
# file holds the maintenance tasks and the dotfile declarations.
#
# Two cadences. `update` is the daily one: cheap, low blast radius, safe to run
# unattended. `update:weekly` adds the work that is bandwidth-heavy, deletes
# things, or rewrites tracked files — none of which pays for itself daily.

[tasks."update:brew"]
description = "Upgrade homebrew formulae"
run = [
  "brew update",
  "brew upgrade",
]

[tasks."update:brew-weekly"]
description = "Refresh casks and reclaim homebrew disk space"
# Homebrew allows one process at a time; without this it races update:brew.
depends = ["update:brew"]
# --greedy bypasses the "already latest" short-circuit for casks that carry
# their own updater — most of the ones here (browsers, Slack, Spotify,
# 1Password) self-update, so a daily greedy pass re-downloads full installers
# to arrive where they already were. --prune=all drops homebrew's 120-day
# cache grace, so it belongs on the same slower cadence.
run = [
  "brew upgrade --cask --greedy",
  "brew cleanup --prune=all",
]

[tasks."update:mise"]
description = "Upgrade mise tools and refresh mise.lock"
# $HOME, so the global config is the active config root. Left in this repo the
# config root would be this file, which declares no tools at all.
dir = "{{env.HOME}}"
# No --minimum-release-age override: mise's 24h default is the point. Nearly
# every tool in the global config is "latest", so a same-day release would go
# straight onto ~100 tools unattended. Waiting a day lets a yanked or broken
# release be caught first, and costs nothing at this cadence — the next run
# picks it up.
run = [
  "mise upgrade",
  # `mise upgrade` only records the platform it ran on; `mise lock --global`
  # refreshes checksums and URLs for everything else in mise.lock. Without
  # --platform it locks every platform family the lockfile already mentions,
  # so a lockfile that once saw linux or windows keeps carrying them. This
  # machine set is macOS on Apple silicon only.
  "mise lock --global --platform macos-arm64",
]

[tasks."update:mise-prune"]
description = "Reclaim mise disk space"
dir = "{{env.HOME}}"
depends = ["update:mise"]
# Kept out of update:mise on purpose: pruning immediately after an upgrade
# deletes the last known-good version of every tool that just moved, so a bad
# "latest" leaves nothing to fall back to.
run = "mise prune --yes"

[tasks."update:skills"]
description = "Upgrade global agent skills"
# The lockfile this rewrites is linked from skills/dot-skill-lock.json, so an
# upgraded skill shows up in the `update` task's closing git status. The CLI
# writes the lock in place rather than by rename, which is what keeps the
# symlink intact across runs.
run = "npx -y skills@latest update --global --yes"

[tasks."update:herdr-plugins"]
description = "Upgrade herdr plugins installed from GitHub"
# herdr keeps its plugin registry in ~/.config/herdr/plugins.json, next to
# absolute install paths and timestamps, so it cannot be linked from here.
# herdr/plugins.lock.json is a snapshot of just the source and commit of each
# plugin, so an upgraded plugin shows up in the `update` task's closing git
# status. Local plugins are listed without a commit: bulk update skips them.
run = [
  "herdr plugin update --yes",
  """herdr plugin list --json | jq '[.result.plugins[] | {id: .plugin_id, enabled, source: (if .source.kind == "github" then "\\(.source.owner)/\\(.source.repo)" else .source.kind end), commit: .source.resolved_commit}] | sort_by(.id)' > herdr/plugins.lock.json""",
]

[tasks."update:yazi"]
description = "Upgrade yazi plugins and flavors"
run = "ya pkg upgrade"

[tasks."update:nvim"]
description = "Sync lazy.nvim plugins, upgrade mason packages and treesitter parsers"
run = [
  "nvim --headless '+Lazy! sync' +qa",
  "nvim --headless '+luafile {{config_root}}/lazyvim/headless-update.lua'",
]

[tasks."update:nvim-nightly"]
description = "Reinstall the neovim nightly build behind the nvn alias"
# Not in `update`: nightly is opt-in. --force because "nightly" is a fixed
# version name, so mise otherwise treats an existing install as current.
run = "mise install --force neovim@nightly"

[tasks."update:tuios-nightly"]
description = "Build tuios from main and install it behind the tuios alias"
# Not in `update`: nightly is opt-in. Installed beside the release from mise,
# which sits ahead of ~/.local/bin on PATH and would shadow a build placed
# there, so the binaries live under their own prefix and the alias points at it.
# --keep-server leaves a running daemon on the previous build; `tuios
# kill-server` switches over when the panes can be spared.
tools = { go = "latest" }
run = """
set -euo pipefail
root="$HOME/.local/share/tuios-nightly"
src="$root/src"
if [ -d "$src/.git" ]; then
  git -C "$src" fetch --depth 1 origin main
  git -C "$src" reset --hard FETCH_HEAD
else
  mkdir -p "$root"
  git clone --depth 1 https://github.com/Gaurav-Gosain/tuios.git "$src"
fi
"$src/scripts/install.sh" pure --prefix "$root/bin" --keep-server
"""

[tasks."update:manifests"]
description = "Rewrite the homebrew manifests this repo tracks"
# Weekly, not daily: these two files are rewritten on every run, and most of
# the resulting diff is transitive dependency version bumps rather than a
# package this repo chose to track. Daily it is a permanently dirty worktree
# for almost no signal.
depends = ["update:brew", "update:brew-weekly"]
run = [
  "brew bundle dump --global --force --formula --cask --tap",
  "brew list --versions | sort > homebrew/Brewfile.versions",
]

[tasks."sync:claude-mcp"]
description = "Merge claude/mcp-servers.json into the user-scope MCP servers in ~/.claude.json"
# ~/.claude.json also holds session history and OAuth state, so it cannot be
# linked from here. Declared servers overwrite same-named entries; servers
# added by hand stay. $HOME in the JSON is expanded here, not by Claude Code.
# Written via a temp file and rename so a running session never reads half a file.
run = """
set -euo pipefail
target="$HOME/.claude.json"
tmp="$(mktemp "$target.XXXXXX")"
jq --arg home "$HOME" --slurpfile servers '{{config_root}}/claude/mcp-servers.json' \
  '.mcpServers = ((.mcpServers // {}) + ($servers[0] | walk(if type == "string" then gsub("\\\\$HOME"; $home) else . end)))' \
  "$target" > "$tmp"
chmod 600 "$tmp"
mv "$tmp" "$target"
"""

[tasks."sync:rex-herdr"]
description = "(Re)load the herdr socket server's LaunchAgent"
# bootout fails when the agent is not loaded yet, which is fine.
run = """
set -euo pipefail
plist="$HOME/Library/LaunchAgents/com.jonasws.rex-herdr.plist"
[[ -e $plist ]] || { echo "$plist is missing: run 'mise dotfiles apply' first" >&2; exit 1; }
launchctl bootout "gui/$(id -u)" "$plist" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
"""

[tasks."sync:karabiner"]
description = "Generate karabiner.json from karabiner-ts and copy it to ~/.config/karabiner"
dir = "{{config_root}}/karabiner-ts"
# Pinned to the minor series so a new bun major cannot change the output; the
# global `bun = "latest"` is not what this task runs on.
tools = { bun = "1.4" }
# Karabiner replaces a symlinked karabiner.json when it saves, so the live file
# is a copy. The previous one is kept next to it as karabiner.json.pre-sync.bak.
# Only the complex_modifications rules are generated; the devices block is
# whatever the repo copy holds.
run = """
set -euo pipefail
bun install --frozen-lockfile
bun karabiner.config.ts
src='{{config_root}}/karabiner/.config/karabiner/karabiner.json'
dst="$HOME/.config/karabiner/karabiner.json"
jq empty "$src"
if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
  echo "karabiner.json is up to date"
  exit 0
fi
mkdir -p "$(dirname "$dst")"
[ -f "$dst" ] && cp "$dst" "$dst.pre-sync.bak"
tmp="$(mktemp "$dst.XXXXXX")"
cp "$src" "$tmp"
chmod 600 "$tmp"
mv "$tmp" "$dst"
echo "karabiner.json synced"
"""

[tasks.update]
description = "Daily upgrade, then show what changed"
depends = ["update:brew", "update:mise", "update:skills", "update:herdr-plugins", "update:yazi", "update:nvim"]
run = "git status --short"

[tasks."update:weekly"]
description = "Everything in `update`, plus casks, pruning and manifests"
depends = ["update", "update:brew-weekly", "update:mise-prune", "update:manifests"]
# `update` prints its own status before the manifests are rewritten; this is
# the one that reflects the finished run.
run = "git status --short"

# ── Dotfiles ────────────────────────────────────────────────────────────────
# `mise -C ~/dotfiles dot apply` deploys this repo into $HOME. One group per
# application: its directory holds that application's config as it appears on
# disk, and `target` says where. Groups link each file (`symlink-each`) unless
# they say `mode = "symlink"`, which links the directory itself — needed where
# the application writes back into its own config directory (lazy-lock.json,
# yazi's package.toml), so those writes land in the repo.
#
# Files that live directly in $HOME are named `dot-<name>` here and deploy as
# `.<name>` (`dot_prefix`), so nothing in the repo is hidden from tv or yazi.

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true

[dotfile_groups.atuin]
root = "atuin"
target = "~/.config/atuin"

[dotfile_groups.aws]
root = "aws"
target = "~/.aws"

[dotfile_groups.bash]
root = "bash"
target = "~"

[dotfile_groups.bat]
root = "bat"
target = "~/.config/bat"

[dotfile_groups.claude]
root = "claude"
target = "~/.claude"
# Read by sync:claude-mcp, not by Claude Code.
exclude = ["mcp-servers.json"]

# ~/.claude/skills also holds skills installed from elsewhere, so each skill
# kept here is linked on its own rather than the whole directory.
[dotfile_groups.claude.entries]
"~/.claude/themes" = { mode = "symlink" }
"~/.claude/skills/brainstorming" = { mode = "symlink" }
"~/.claude/skills/dispatching-parallel-agents" = { mode = "symlink" }
"~/.claude/skills/find-docs" = { mode = "symlink" }
"~/.claude/skills/jvm-sandbox-tests" = { mode = "symlink" }
"~/.claude/skills/markdown-preview" = { mode = "symlink" }
"~/.claude/skills/maven-kotlin-builds" = { mode = "symlink" }
"~/.claude/skills/sibling-api-docs" = { mode = "symlink" }
"~/.claude/skills/systematic-debugging" = { mode = "symlink" }
"~/.claude/skills/test-driven-development" = { mode = "symlink" }
"~/.claude/skills/watch-subagents" = { mode = "symlink" }

[dotfile_groups.colima]
root = "colima"
target = "~/.config/colima"
# colima rewrites default/colima.yaml on every start; only the template is ours.
exclude = ["default", "sh.brew.colima.plist"]

[dotfile_groups.fish]
root = "fish"
target = "~/.config/fish"
exclude = ["README.md"]

[dotfile_groups.firefox]
root = "firefox"
target = "~/.local/bin"
mode = "symlink-each"

[dotfile_groups.fnox]
root = "fnox"
target = "~/.config/fnox"
exclude = ["README.md", "wrapped"]

[dotfile_groups.fnox-trees]
root = "fnox-trees"

[dotfile_groups.gh-dash]
root = "gh-dash"
target = "~/.config/gh-dash"

[dotfile_groups.ghostty]
root = "ghostty"
target = "~/.config/ghostty"
mode = "symlink"

[dotfile_groups.git]
root = "git"
target = "~/.config/git"
exclude = ["README.md"]

[dotfile_groups.git.entries]
"~/.config/git/template" = { mode = "symlink" }
"~/.config/git/hooks" = { mode = "symlink" }

[dotfile_groups.herdr]
root = "herdr"
target = "~/.config/herdr"
exclude = ["automatic-rename"]

[dotfile_groups.homebrew]
root = "homebrew"
target = "~/.config/homebrew"

[dotfile_groups.hunk]
root = "hunk"
target = "~/.config/hunk"

[dotfile_groups.intellij]
root = "intellij"
dot_prefix = true

[dotfile_groups.lazygit]
root = "lazygit"
target = "~/.config/jesseduffield/lazygit"

[dotfile_groups.lazyjira]
root = "lazyjira"
target = "~/.config/lazyjira"

[dotfile_groups.lazyvim]
root = "lazyvim"
target = "~/.config/nvim"
mode = "symlink"

[dotfile_groups.leaf]
root = "leaf"
target = "~/.config/leaf"

[dotfile_groups.lnav]
root = "lnav"
target = "~/.config/lnav"

[dotfile_groups.maven]
# Only settings.xml: ~/.m2 also holds the local repository.
root = "maven"
target = "~/.m2"

[dotfile_groups.mdcat]
root = "mdcat"
target = "~/.config/mdcat"
mode = "symlink"

[dotfile_groups.mise]
# Not `mise/`: mise reads <project>/mise/config.toml as project config, which
# would load the global config a second time whenever it runs in this repo.
root = "mise-global"
target = "~/.config/mise"

[dotfile_groups.nono]
root = "nono"
target = "~/.config/nono"
mode = "symlink"

[dotfile_groups.nushell]
root = "nushell"
target = "~/.config/nushell"
exclude = ["functions"]

[dotfile_groups.otree]
root = "otree"
target = "~/.config"

[dotfile_groups.posting]
root = "posting"
target = "~/.config/posting"

[dotfile_groups.presenterm]
root = "presenterm"
target = "~/.config/presenterm"
mode = "symlink"

[dotfile_groups.rex]
root = "rex"
target = "~/.config/rex"
exclude = ["README.md", "herdr/test", "launchd"]

# The herdr socket server's LaunchAgent; see rex/herdr/serve.
[dotfile_groups.rex-launchd]
root = "rex/launchd"
target = "~/Library/LaunchAgents"

[dotfile_groups.ripgrep]
root = "ripgrep"
dot_prefix = true

[dotfile_groups.skills]
root = "skills"
target = "~/.agents"
dot_prefix = true

[dotfile_groups.starship]
root = "starship"
target = "~/.config"

[dotfile_groups.superfile]
root = "superfile"
target = "~/.config/superfile"
mode = "symlink"

[dotfile_groups.tabiew]
root = "tabiew"
target = "~/.config/tabiew"
mode = "symlink"

[dotfile_groups.television]
root = "television"
target = "~/.config/television"
mode = "symlink"

[dotfile_groups.tig]
root = "tig"
dot_prefix = true

[dotfile_groups.tmux]
root = "tmux"
dot_prefix = true

[dotfile_groups.tridactyl]
root = "tridactyl"
target = "~/.config/tridactyl"
mode = "symlink"

[dotfile_groups.tuicr]
root = "tuicr"
target = "~/.config/tuicr"
mode = "symlink"

[dotfile_groups.tuios]
# The whole directory: the keybind manager and `tuios config` rewrite
# config.toml, and plugins.lock and themes/ are written next to it.
root = "tuios"
target = "~/.config/tuios"
mode = "symlink"

[dotfile_groups.wezterm]
root = "wezterm"
dot_prefix = true

[dotfile_groups.yazi]
root = "yazi"
target = "~/.config/yazi"
mode = "symlink"

[dotfile_groups.zed]
root = "zed"
target = "~/.config/zed"

[dotfile_groups.zellij]
root = "zellij"
target = "~/.config/zellij"
mode = "symlink"

# Directories that sit beside a group's target rather than inside it.
[dotfiles]
"~/.local/bin/wrapped" = { source = "fnox/wrapped", mode = "symlink" }
"~/.local/bin/resign-commits" = { source = "bin/resign-commits", mode = "symlink" }
"~/.config/herdr-automatic-rename" = { source = "herdr/automatic-rename", mode = "symlink" }
