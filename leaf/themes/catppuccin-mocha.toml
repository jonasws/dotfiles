# Catppuccin Mocha for leaf. Markdown colours follow the glamour theme
# (catppuccin/glamour catppuccin-mocha.json): red/peach/yellow/green/sapphire/
# lavender headings, blue links, maroon inline code on mantle.
#
# syntax: syntect ships only base16-ocean.{dark,light}, base16-eighties.dark,
# base16-mocha.dark, InspiredGitHub and Solarized. base16-ocean.dark has the
# closest pastel hues and lightness; base16-mocha.dark is a different, warm
# brown palette that merely shares the name.
base = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg = "#181825"
toc_border = "#313244"
content_bg = "#1e1e2e"
scrollbar_hover = "#cba6f7"
status_bg = "#11111b"
status_separator = "#6c7086"
status_brand_fg = "#1e1e2e"
status_brand_bg = "#cba6f7"
status_filename_fg = "#cdd6f4"
status_filename_bg = "#313244"
status_watch_fg = "#a6e3a1"
status_watch_bg = "#323c3f"
status_reloaded_fg = "#1e1e2e"
status_reloaded_bg = "#a6e3a1"
status_search_fg = "#f9e2af"
status_search_bg = "#313244"
status_success_fg = "#a6e3a1"
status_success_bg = "#323c3f"
status_warning_fg = "#f9e2af"
status_error_fg = "#f38ba8"
