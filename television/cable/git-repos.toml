[metadata]
name = "git-repos"
requirements = ["fd", "git", "zoxide"]
description = """
A channel to select from git repositories on your local machine.

This channel uses `fd` to find directories that contain a `.git` subdirectory, and then allows you to preview the git log of the selected repository.

Results are ranked by zoxide frecency first (most visited/recent repos on top), falling back to fd's raw discovery order for repos zoxide hasn't scored yet (e.g. freshly cloned ones).
"""

[source]
# bash: tv runs commands through $SHELL (fish), which costs about 80ms a run.
shell = "bash"
# The fd half of the list is cached; see the script.
command = "~/.config/television/scripts/git-repos.sh"
display = "{split:/:-1}"
no_sort = true
frecency = false

[preview]
shell = "bash"
command = "git -C {} log -n 200 --pretty=medium --all --graph --color"

[keybindings]
enter = "actions:open"
ctrl-e = "actions:edit"
ctrl-w = "actions:workspace"
ctrl-y = "actions:copy_path"

[actions.open]
description = "Open as a Rex session, tuios session or Herdr workspace, or cd in a plain shell"
command = "~/.config/television/scripts/open-repo.sh '{}'"
shell = "bash"
mode = "execute"

[actions.cd]
shell = "bash"
description = "Open a new shell in the selected repository"
command = "cd '{}' && $SHELL"
mode = "execute"

[actions.edit]
description = "Open the repository in editor"
command = "${EDITOR:-vim} '{}'"
shell = "bash"
mode = "execute"

[actions.workspace]
description = "Open as a tuios session or Herdr workspace, or focus it if already open"
command = """
if [[ ${TUIOS_ENV:-} == 1 ]]; then
  exec ~/.config/television/scripts/tuios-session.sh '{}'
fi
exec ~/.config/television/scripts/herdr-workspace.sh '{}'
"""
shell = "bash"
mode = "execute"

[actions.copy_path]
description = "Copy the repository path, with ~ for the home directory"
command = """p='{}'; printf '%s' "${p/#$HOME/\\~}" | pbcopy"""
shell = "bash"
mode = "execute"
