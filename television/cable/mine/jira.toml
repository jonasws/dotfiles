[metadata]
name = "jira"
description = """
Jira issues over the REST API, one source per board, with a read-only scoped
API token from the "Atlassian API Token" item in 1Password.

Tab cycles CN Kunde (board 353, its saved board filter) as active lanes and
backlog, then CN Kunde's open epics. The CN Ops (board 131) sources are
commented out in [source]. Rows: key, lane, priority, type, age, assignee,
summary, epic. Lists show their last result at once and
refresh in the background. Enter prints the issue's URL, alt-enter opens it
in the browser, ctrl-y copies the URL (replacing tv's copy of the whole row).
ctrl-x lists the other actions: copy the key, print the URL or the key. Script: television/scripts/jira.sh.
"""
requirements = ["fnox", "curl", "jq", "pandoc", "leaf"]

[source]
# bash: tv runs commands through $SHELL (fish), which costs about 80ms a run.
shell = "bash"
# Each board's saved filter (CN Ops: board 131, filter 10467; CN Kunde: board
# 353, filter 10468), split into the board's active lanes and its backlog.
# Jira drops a referenced filter's own ORDER BY, hence the explicit Rank. The
# trailing number caps the issues fetched.
command = [
  # { name = "CN Ops", run = '''~/.config/television/scripts/jira.sh list 'filter = 10467 AND (statusCategory = "In Progress" OR status = "Selected for Development") ORDER BY Rank ASC' 100''' },
  { name = "CN Kunde", run = '''~/.config/television/scripts/jira.sh list 'filter = 10468 AND (statusCategory = "In Progress" OR status = "Selected for Development") ORDER BY Rank ASC' 100''' },
  # { name = "CN Ops backlog", run = '''~/.config/television/scripts/jira.sh list 'filter = 10467 AND status = Backlog ORDER BY Rank ASC' 50''' },
  { name = "CN Kunde backlog", run = '''~/.config/television/scripts/jira.sh list 'filter = 10468 AND status = Backlog ORDER BY Rank ASC' 50''' },
  # Open epics owned by the CN Kunde team. JQL matches the Team field on its
  # id, not its name.
  { name = "CN Kunde epics", run = '''~/.config/television/scripts/jira.sh list 'project = CDS AND issuetype = Epic AND statusCategory != Done AND "Team[Team]" = "b974dd2f-f9b9-4334-80db-be7cc9263cf3" ORDER BY Rank DESC' 100''' },
]
ansi = true
# Enter prints the issue URL; the site is fixed, so the template can build it.
output = "https://vygruppen.atlassian.net/browse/{strip_ansi|split: :0}"
# Keep Jira's order (the board's rank) rather than tv's.
no_sort = true
frecency = false
# Rereads the cache, which a background refetch replaces at most once a
# minute, so this costs no API calls of its own.
watch = 5.0

[preview]
shell = "bash"
command = "~/.config/television/scripts/jira.sh preview '{strip_ansi|split: :0}'"

[ui]
layout = "portrait"

[ui.input_bar]
header = "Jira"

[ui.preview_panel]
size = 60
header = "{strip_ansi|split: :0}"

[keybindings]
tab = "cycle_sources"
enter = "confirm_selection"
alt-enter = "actions:open"
ctrl-y = "actions:copy-url"

[actions.open]
description = "Open the issue in the browser"
command = "~/.config/television/scripts/jira.sh open '{strip_ansi|split: :0}'"
mode = "fork"

[actions.copy-url]
description = "Copy the issue URL"
command = "printf %s 'https://vygruppen.atlassian.net/browse/{strip_ansi|split: :0}' | pbcopy"
mode = "fork"

[actions.copy-key]
description = "Copy the issue key"
command = "printf %s '{strip_ansi|split: :0}' | pbcopy"
mode = "fork"

[actions.print-url]
description = "Print the issue URL"
command = "printf '%s\n' 'https://vygruppen.atlassian.net/browse/{strip_ansi|split: :0}'"
mode = "execute"

[actions.print-key]
description = "Print the issue key"
command = "printf '%s\n' '{strip_ansi|split: :0}'"
mode = "execute"
