[metadata]
name = "herdr-sessions"
description = """
Fuzzy find and jump to Herdr panes.

Panes are listed as an attention queue: blocked, done, idle, working,
unclassified agents, then panes running some other command, then idle shells.
Each row is the pane id, workspace label, what the pane is running, and its
terminal title. The state column is coloured by that same queue position, and
the label is coloured per workspace so panes of one workspace read as a block.
Status glyphs and agent colours follow herdr-bar, which follows Herdr's sidebar.

Tab cycles the scope, after herdr-bar: all, agents, panes running some
other command, idle shells, and agents that need you (blocked or done).
Typing a sigil first narrows the same way: @ agents, % panes, # shells,
? needs you. ($ and ! are tv query syntax, so herdr-bar's sigils for the
last two could not be kept.)

Bound to prefix+f, prefix+k and ctrl+alt+k (Cmd+K) in herdr's config.toml.
"""
requirements = ["herdr", "nu", "jq", "nc"]

[source]
command = [
  { name = "all", run = "~/.config/television/scripts/herdr-sessions.nu all" },
  { name = "@ agents", run = "~/.config/television/scripts/herdr-sessions.nu agents" },
  { name = "% panes", run = "~/.config/television/scripts/herdr-sessions.nu commands" },
  { name = "# shells", run = "~/.config/television/scripts/herdr-sessions.nu shells" },
  { name = "? needs you", run = "~/.config/television/scripts/herdr-sessions.nu attention" },
]
# tv runs commands through $SHELL, which is fish here, and fish costs about 70ms
# a run before the script starts. That is the visible gap between the frame and
# the list, and it repeats on every watch refresh and every preview.
shell = "bash"
# `ansi` and `display` are mutually exclusive (a display template selects the
# processor that never strips escape codes), so colouring the state column means
# the pane id must be visible text. It leads the row, dimmed, which reads more
# cleanly than trailing it after a ragged-length title.
ansi = true
output = "{strip_ansi|split: :0}"
# Agent state changes while the picker is open, so keep the list live. A refresh
# is a single `herdr api snapshot`, so this is cheap. Previews are unaffected:
# they run per selected entry and are cached, not polled.
watch = 2.0
frecency = false

# One `herdr pane read` per preview, nothing else: the previewer kills any job
# that takes over 3s. `visible` is the only source that works for both shells
# and agents painting on the alternate screen; ctrl-f cycles to the others.
#
# herdr only ever emits SGR sequences, which television parses into styled text
# via ansi_to_tui, so `--format ansi` renders the pane in its real colors. The
# plain-text variant is kept one ctrl-f away as a fallback.
#
# The empty-scope guard lives in a script because tv runs previews through
# $SHELL, which is fish here.
[preview]
shell = "bash"
command = [
  "~/.config/television/scripts/herdr-preview.sh '{strip_ansi|split: :0}' --source visible --lines 200 --format ansi",
  "~/.config/television/scripts/herdr-preview.sh '{strip_ansi|split: :0}' --source visible --lines 200",
  "~/.config/television/scripts/herdr-preview.sh '{strip_ansi|split: :0}' --source recent-unwrapped --lines 400 --format ansi",
]

[ui]
layout = "portrait"
input_header = "Herdr panes"

[ui.preview_panel]
size = 62
header = "{strip_ansi|split: :0}"
scrollbar = true

[keybindings]
shortcut = "f4"
# Cmd+K opens this picker from herdr, and a popup takes all input while it is
# open, so the same chord reaches tv here and toggles it closed.
ctrl-alt-k = "quit"
enter = "actions:focus"
# Enter focuses a single pane, so multi-select has no use here and Tab is free
# to switch scope. tv has no reverse cycle, so shift-tab is left alone.
tab = "cycle_sources"

# Focus the exact pane over the socket API. `herdr tab focus` would only reach
# the tab's active pane, which is the wrong one whenever a tab is split.
# `execute` replaces tv with the command, so the picker is gone by the time
# focus lands.
[actions.focus]
# bash: tv runs commands through $SHELL (fish), which costs about 80ms a run.
shell = "bash"
description = "Jump to the selected pane"
command = "~/.config/television/scripts/herdr-focus.sh '{strip_ansi|split: :0}'"
mode = "execute"
