[metadata]
name = "hotkeys"
description = """
Cheat sheet for my modal tools: herdr, lazygit, yazi, tuicr, hunk, television,
fx, lnav, tabiew and WezTerm.

Tab steps from all tools to one tool at a time. ★ marks a binding from my own
config rather than the tool's default. The preview starts hidden; ctrl-o shows
the rest of the binding's section. Data: television/hotkeys/<tool>.tsv.
"""

[source]
# bash: tv runs commands through $SHELL (fish), which costs about 80ms a run.
shell = "bash"
command = [
  { name = "all", run = "~/.config/television/scripts/hotkeys.sh list" },
  { name = "herdr", run = "~/.config/television/scripts/hotkeys.sh list herdr" },
  { name = "lazygit", run = "~/.config/television/scripts/hotkeys.sh list lazygit" },
  { name = "yazi", run = "~/.config/television/scripts/hotkeys.sh list yazi" },
  { name = "tuicr", run = "~/.config/television/scripts/hotkeys.sh list tuicr" },
  { name = "hunk", run = "~/.config/television/scripts/hotkeys.sh list hunk" },
  { name = "television", run = "~/.config/television/scripts/hotkeys.sh list television" },
  { name = "fx", run = "~/.config/television/scripts/hotkeys.sh list fx" },
  { name = "lnav", run = "~/.config/television/scripts/hotkeys.sh list lnav" },
  { name = "tabiew", run = "~/.config/television/scripts/hotkeys.sh list tabiew" },
  { name = "wezterm", run = "~/.config/television/scripts/hotkeys.sh list wezterm" },
]
ansi = true
output = "{strip_ansi}"
no_sort = true
frecency = false

[preview]
shell = "bash"
command = "~/.config/television/scripts/hotkeys.sh preview '{strip_ansi}'"

[ui]
layout = "portrait"
preview_panel = { size = 40, hidden = true }

[keybindings]
tab = "cycle_sources"
