[metadata]
name = "tuios-worktrees"
description = """
The checkouts of one repository, the main one first, each with the tuios
session open in it: its agent state, uncommitted changes (~), commits ahead
of the base (+) and whether the branch is merged.

git-repos opens it, in tuios, for a repository with more than one checkout;
Ctrl-W there skips it and opens the main checkout. The repository comes from
$TV_WORKTREE_REPO.

Enter switches to the checkout's session, creating <repo>-<branch> when there
is none. Ctrl-D removes the checkout and its session but keeps the branch,
and asks before stashing or discarding uncommitted changes.

tuios only.
"""
requirements = ["tuios", "git", "jq", "gum"]

[source]
# tv runs commands through $SHELL (fish here), which costs about 70ms a run.
shell = "bash"
command = "~/.config/television/scripts/tuios-worktrees.sh list"
# ansi and display exclude each other, so the row leads with its token.
ansi = true
output = "{strip_ansi|split: :0}"
no_sort = true
frecency = false

[preview]
shell = "bash"
command = "~/.config/television/scripts/tuios-worktrees.sh preview '{strip_ansi|split: :0}'"

[ui]
input_header = "worktrees"

[ui.preview_panel]
header = "{strip_ansi|split: :0}"

[keybindings]
ctrl-alt-k = "quit"
enter = "actions:open"
ctrl-d = "actions:remove"
ctrl-y = "actions:copy_path"

# `execute` replaces tv with the command, so the popup is gone by the time the
# switch lands.
[actions.open]
shell = "bash"
description = "Switch to the checkout's tuios session, creating it if missing"
command = "~/.config/television/scripts/tuios-worktrees.sh open '{strip_ansi|split: :0}'"
mode = "execute"

[actions.remove]
shell = "bash"
description = "Remove the checkout and its session, keeping the branch"
command = "~/.config/television/scripts/tuios-worktrees.sh rm '{strip_ansi|split: :0}'"
mode = "execute"

[actions.copy_path]
shell = "bash"
description = "Copy the checkout's path, with ~ for the home directory"
command = """p=$(~/.config/television/scripts/tuios-worktrees.sh path '{strip_ansi|split: :0}'); printf '%s' "${p/#$HOME/\\~}" | pbcopy"""
mode = "execute"
