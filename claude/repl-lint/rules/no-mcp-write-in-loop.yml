# severity warning makes the hook ask the user rather than deny.
id: no-mcp-write-in-loop
language: javascript
severity: warning
message: "State-changing MCP tool called in a loop: confirm the batch"
rule:
  kind: call_expression
  has:
    field: function
    regex: '^mcp__\w+__\w*(send|post|create|update|delete|write|publish)\w*$'
  inside:
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
      - kind: arrow_function
      - kind: function_expression
    stopBy: end
