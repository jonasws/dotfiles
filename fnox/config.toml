#:schema https://fnox.jdx.dev/schema.json

# Machine-wide fnox configuration.
#
# Secrets are referenced here, never stored here: the values live in 1Password
# and are resolved on demand. This file is safe to commit.
#
# Not in this repo, and must stay out of git: ~/.config/fnox/age.txt (age identity).

# Keep secrets out of the interactive shell. They are injected only into
# `fnox exec` subprocesses, so an agent launched from this shell inherits
# nothing. Individual secrets can opt back in with `env = true`.
env = "exec"

# Fail loudly rather than running a build with a silently missing credential.
if_missing = "error"

[daemon]
enabled = true
idle_timeout = "8h"

[providers.onepass]
type = "1password"
account = "https://capragroup.1password.eu/"


[providers.sync-age]
type = "age"
recipients = [
  "age1se1qft9hckpthwvn56y8hf68cs79wfsrrlq9ccws6z9hktgsgxjrhtj5rax3vz",
]
key_file = "~/.config/fnox/age-se.txt"

# Two mechanisms decide who sees a secret, and they answer different questions.
# `env = false` means never injected into any environment: the consumer fetches the
# value itself, as fnox-secret (mise's credential_command, the MCP wrappers) and the
# gcal function do. A profile means injected as an environment variable, but only into the one
# process started under it — which no per-secret flag can express, since a flag has
# only "every `fnox exec` subprocess" and "none". Secrets below are top-level, so
# every `fnox exec` receives them; that is what the profiles' `--no-defaults` sheds.

[secrets]
# Read by ~/.m2/settings.xml as ${env.LIFLIG_GITHUB_PAT} and
# ${env.NEXUS_PASSWORD} for the `github` and `vy-nexus` server entries.
LIFLIG_GITHUB_PAT= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = "exec", sync = { provider = "sync-age", value = "fnox-age-batch-v1::HosE8sZwqZ75ErGyWU5XfFjN51GtP0vLWwEYLUnnOCDQUpifnZREa025YpJlvsCz+DpJ71s/l2crcEKiD87thm0q6pw=" } }
NEXUS_PASSWORD= { provider = "onepass", value = "op://Employee/Vy - Nexus/password", env = "exec", sync = { provider = "sync-age", value = "fnox-age-batch-v1::Ve19wSKTbN2hswJCA39KgIjT/gtqVFYbhj922NYafJlUZClIuBfxGnR6UzbaZRTkAKwfP5tqQJXB47l/rEoBtpH2Opo=" } }

# Read by mise, whose `[settings.github] credential_command` runs
# `fnox-secret MISE_GITHUB_TOKEN`. Fine-grained, public-repo read and nothing else:
# mise calls the GitHub API only to list releases and fetch assets, so the token
# exists purely to lift the 60/hr anonymous rate limit. `env = false` keeps it
# out of every `fnox exec` subprocess. The github MCP server wrapper reads it too,
# so agents get public read access only.
MISE_GITHUB_TOKEN= { provider = "onepass", value = "op://Employee/mise github token/password", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::yUWt9oe4H/PLSia/hBlgxceqbHKTvONP6gEEvt7DWzc8fCAEe7t3qnQgs+0tRqeGlT2E0DKJG4p093P/Yj8P1r09DY5jrcN5yNh7ts7BVmuv3ZKOd1BRzUQ/640gUHvTS9iQmQXSFvS/srS7ZzduRaIiXVJrVdFQ/w==" } }

# Read through the wrappers in ~/.local/bin/wrapped: the gh wrapper exports
# GITHUB_PERSONAL_ACCESS_TOKEN as GH_TOKEN (full access, for gh only), and the exa
# MCP server wrapper reads EXA_API_KEY. Each wrapper fetches its own token with
# fnox-secret and exports it to that one process, so `env = false` keeps both
# out of every `fnox exec` subprocess -- maven never receives them.
#
# Top-level rather than in a profile each: every profile has its own daemon and
# its own sync blob, so each one cost a Touch ID on a cold start. Here they share
# the default daemon and one blob with every other top-level secret.
#
# EXA_API_KEY: the stdio server reads its credential only from this variable and
# calls api.exa.ai directly, so without a key every request 401s -- the anonymous
# tier belongs to the hosted endpoint at mcp.exa.ai, not to the package.
GITHUB_PERSONAL_ACCESS_TOKEN= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::BUNDjEI29HrD+WG73g6cf5+ggPqx9AO4gxaKR50ynDi10bYOroVI8hpCkfpNUjLWo2N4bZuZkaxTT6UeXQmz3lZrYrc=" } }
EXA_API_KEY= { provider = "onepass", value = "op://Employee/Exa API Key/password", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::3dqy6gsuwNmxmax6Zjou5nEDCedqahf2jtLDrje5EUGZCx18OZ6NZYjHNYPUJvvXon65dQTsjQ3Mbl4HVqOIYw==" } }
#
# CONTEXT7_API_KEY: claude/hooks/context7-env.sh puts it into every Claude Code
# Bash command at session start, so the find-docs skill's Context7 API calls
# authenticate inside the sandbox. Read-only docs quota, so that wide visibility is fine.
CONTEXT7_API_KEY= { provider = "onepass", value = "op://Employee/Context7 API Key/credential", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::vymc9emby2BS3DNfJ0CK61Rbr2EAOkoqzmPISdKbVcqzDzpYVhT4NVEyHvgK6qy5ZSkAG3xht73FNt5cgifcsA7sqq87Jwk=" } }

# Anthropic API key for pi. Never handed to pi itself: the pi-agent nono profile
# reads it through pi/bin/pi-credential (outside the sandbox) and its proxy
# injects it into requests to api.anthropic.com, while pi holds a phantom.
# `env = false`; run `mise run sync-secrets` after adding or rotating it.
ANTHROPIC_API_KEY= { provider = "onepass", value = "op://Employee/Anthropic API Key/credential", env = false }

# Atlassian API token for Jira Cloud, with the account and site it belongs to.
# Read by the lazyjira wrapper in ~/.local/bin/wrapped, which exports them to
# lazyjira only. `env = false`.
JIRA_API_TOKEN= { provider = "onepass", value = "op://Employee/Atlassian API Token/credential", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::Xp4YVRmr4TprRDnTK6GUfoSKpxgmROAYgBDzQV5jAWIn7RLeI7UjD3Zg83hoZMih8kX3JlKv26bsqi1K6azMe75yLTMvmq/FQCJOfzr/gFJWdU/6zjaj+Cw8IzD0taZYElXZnEB9y+molAeoqrOofbQlUbRus2WyHdAQhv+4kD6vlbpO0TRTu/smTMehPDUsvEcAyfKkU+weiVQ/88SNQ2guFg6PhnX5Ij77Z1qjLoBauxooUVKUXbLnYRsMw3snkWp601XmJodk6q19mm4tOCBPqlJQXU12WQu0gg==" } }
JIRA_CLOUD_ID= { provider = "onepass", value = "op://Employee/Atlassian API Token/cloudid", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::S9H9iOCactT1gtHDuR2N61yCCRkOOglzOdY6hRgaj+GYp42B3B6C2bPk0x/FWfqEfpi1WlE+F4IL5OA+ymAXaQ==" } }
JIRA_EMAIL= { provider = "onepass", value = "op://Employee/Atlassian API Token/username", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::gE2iByq/ap/ZdBRulEyaKSzEEnucP7G7FGNC67EsTBaoad+jGogXfFLnFSsdOscZRQ==" } }
JIRA_HOST= { provider = "onepass", value = "op://Employee/Atlassian API Token/hostname", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::GQn2HlxnId+3au0OrwbXT+yR0sfMz9P5hFr6oGUYJMGqxjS/sGNN3dxpTHU4JoYgEuWe" } }

# Read by the `gcal` fish function, which resolves each value with
# `fnox get -P gcalcli --no-defaults`. gcalcli takes the OAuth client only as
# `--client-id` / `--client-secret` flags, so the values are read into the
# function rather than injected as environment variables.
[profiles.gcalcli.secrets]
GCALCLI_CLIENT_ID = { provider = "onepass", value = "op://Employee/gcalcli/username" }
GCALCLI_CLIENT_SECRET = { provider = "onepass", value = "op://Employee/gcalcli/credential" }
