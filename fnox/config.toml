#:schema https://fnox.jdx.dev/schema.json

# Machine-wide fnox configuration.
#
# Secrets are referenced here, never stored here: the values live in 1Password
# and are resolved on demand. This file is safe to commit.
#
# Not in this repo, and must stay out of git: ~/.config/fnox/age.txt (age identity).

# Keep secrets out of the interactive shell. They are injected only into
# `fnox exec` subprocesses, so an agent launched from this shell inherits
# nothing. Individual secrets can opt back in with `env = true`.
env = "exec"

# Fail loudly rather than running a build with a silently missing credential.
if_missing = "error"

[daemon]
enabled = true
idle_timeout = "8h"

[providers.onepass]
type = "1password"
account = "https://capragroup.1password.eu/"


[providers.sync-age]
type = "age"
recipients = [
  "age1se1qft9hckpthwvn56y8hf68cs79wfsrrlq9ccws6z9hktgsgxjrhtj5rax3vz",
]
key_file = "~/.config/fnox/age-se.txt"

# Two mechanisms decide who sees a secret, and they answer different questions.
# `env = false` means never injected into any environment: the consumer fetches the
# value itself, as fnox-secret (mise's credential_command, the MCP wrappers) and the
# gcal function do. A profile means injected as an environment variable, but only into the one
# process started under it — which no per-secret flag can express, since a flag has
# only "every `fnox exec` subprocess" and "none". Secrets below are top-level, so
# every `fnox exec` receives them; that is what the profiles' `--no-defaults` sheds.

[secrets]
# Read by ~/.m2/settings.xml as ${env.LIFLIG_GITHUB_PAT} and
# ${env.NEXUS_PASSWORD} for the `github` and `vy-nexus` server entries.
LIFLIG_GITHUB_PAT= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = "exec", sync = { provider = "sync-age", value = "fnox-age-batch-v1::c2hCAVLBYhMM99V27jiVVcurUZOm0vD4kyVHQ2mL8IrSibL7EB4hdifFCMZZ5V387elBymEe5Z/JPyRWtMcTlzz1kFEcyxZfI1t7ZnO5crSBDqYxanL4QN+lWlYi2IUmRr2d5VRabxk6BjjgOcz7psbJ4/9FKxtfdQ==" } }
NEXUS_PASSWORD= { provider = "onepass", value = "op://Employee/Vy - Nexus/password", env = "exec", sync = { provider = "sync-age", value = "fnox-age-batch-v1::xyvA7GFVmjIlP0Uz1cT7N4CNDmTAXKP8e/RCImUAdS1tjWcNuUFnmExa9YLKWKWMb59WOa+rhk5WUsMVdxH9YWmy9aA=" } }

# Read only by mise, whose `[settings.github] credential_command` runs
# `fnox-secret MISE_GITHUB_TOKEN`. Fine-grained, public-repo read and nothing else:
# mise calls the GitHub API only to list releases and fetch assets, so the token
# exists purely to lift the 60/hr anonymous rate limit. `env = false` keeps it
# out of every `fnox exec` subprocess, so maven and the github MCP server never
# receive it.
MISE_GITHUB_TOKEN= { provider = "onepass", value = "op://Employee/mise github token/password", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::d7oseLjBSQV442vAXOdQESqePkwizWebItHau9xk4OM5F0NjETKl1E4FFkJFooTd68d2gu6pGJgPCOgoR575RhAdhFTLyjNSbLWmWOn10QP/BObyEAicJwIHF5YUiaeM3y6JvGwhGNbq0tO+cY0ef+pj9TkH2n/jfw==" } }

# Read by the MCP servers Claude Code starts, through the wrappers of the same
# name in ~/.local/bin/wrapped. The gh wrapper exports GITHUB_PERSONAL_ACCESS_TOKEN
# as GH_TOKEN, since both are the same 1Password item. Each wrapper fetches its own token with
# fnox-secret and exports it to that one process, so `env = false` keeps both
# out of every `fnox exec` subprocess -- maven never receives them.
#
# Top-level rather than in a profile each: every profile has its own daemon and
# its own sync blob, so each one cost a Touch ID on a cold start. Here they share
# the default daemon and one blob with every other top-level secret.
#
# EXA_API_KEY: the stdio server reads its credential only from this variable and
# calls api.exa.ai directly, so without a key every request 401s -- the anonymous
# tier belongs to the hosted endpoint at mcp.exa.ai, not to the package.
GITHUB_PERSONAL_ACCESS_TOKEN= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::CjdJYvhM8shSY781Y3SIWd+/1PEIs034mC62NdH92L71LRsJ9waWC4OGFkABl5TBFKnnbBzKLLvGH5v6Fg5C8fHBsYuOggzj8iwMrQuf3VI7zunwWuD+AgYE9m/ex/CHzta4A8igMl9f+MwA8mW2A9qu+Rlvuqzcvg==" } }
EXA_API_KEY= { provider = "onepass", value = "op://Employee/Exa API Key/password", env = false, sync = { provider = "sync-age", value = "fnox-age-batch-v1::3kvQKfBv1aeWvpRb9ZlWbQX7NyeOwCoQBFWSl1onQ18oqq3SkXhx0fL0shvX/mzzsG9xrE7JpvLnIutsDSWsWQ==" } }

# Read by the `gcal` fish function, which resolves each value with
# `fnox get -P gcalcli --no-defaults`. gcalcli takes the OAuth client only as
# `--client-id` / `--client-secret` flags, so the values are read into the
# function rather than injected as environment variables.
[profiles.gcalcli.secrets]
GCALCLI_CLIENT_ID = { provider = "onepass", value = "op://Employee/gcalcli/username" }
GCALCLI_CLIENT_SECRET = { provider = "onepass", value = "op://Employee/gcalcli/credential" }
