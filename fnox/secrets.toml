#:schema https://fnox.jdx.dev/schema.json

# Machine-wide fnox configuration.
#
# Secrets are referenced here, never stored here: the values live in 1Password
# and are resolved on demand. This file is safe to commit.
#
# Not in this repo, and must stay out of git: ~/.config/fnox/age.txt (age identity).

# Keep secrets out of the interactive shell. They are injected only into
# `fnox exec` subprocesses, so an agent launched from this shell inherits
# nothing. Individual secrets can opt back in with `env = true`.
env = "exec"

# Fail loudly rather than running a build with a silently missing credential.
if_missing = "error"

[daemon]
enabled = true
idle_timeout = "8h"

[providers.onepass]
type = "1password"
account = "https://capragroup.1password.eu/"


[providers.sync-age]
type = "age"
recipients = [
  "age1se1qft9hckpthwvn56y8hf68cs79wfsrrlq9ccws6z9hktgsgxjrhtj5rax3vz",
]
key_file = "~/.config/fnox/age-se.txt"

# Two mechanisms decide who sees a secret, and they answer different questions.
# `env = false` means never injected into any environment: the consumer fetches the
# value itself with `fnox get`, as mise's credential_command, the nono:keychain task
# and the gcal function do. A profile means injected as an environment variable, but only into the one
# process started under it — which no per-secret flag can express, since a flag has
# only "every `fnox exec` subprocess" and "none". Secrets below are top-level, so
# every `fnox exec` receives them; that is what the profiles' `--no-defaults` sheds.

[secrets]
# Read by ~/.m2/settings.xml as ${env.LIFLIG_GITHUB_PAT} and
# ${env.NEXUS_PASSWORD} for the `github` and `vy-nexus` server entries.
LIFLIG_GITHUB_PAT= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = "exec" }
NEXUS_PASSWORD= { provider = "onepass", value = "op://Employee/Vy - Nexus/password", env = "exec" }

# Fine-grained, public-repo read and nothing else. mise reads it through its
# `[settings.github] credential_command` (`fnox get MISE_GITHUB_TOKEN`), only to
# lift the 60/hr anonymous rate limit. Agents get the same token through nono's
# api.github.com route (the nono:keychain task copies it there).
MISE_GITHUB_TOKEN= { provider = "onepass", value = "op://Employee/mise github token/password", env = false }

# Agent credentials, copied once into the keychain items nono reads by
# `mise run nono:keychain`; nono's proxy sends them to their hosts and agents
# hold placeholders only. `env = false` keeps them out of every `fnox exec`.
# GITHUB_PERSONAL_ACCESS_TOKEN is also what you give `gh auth login --with-token`
# once, so gh, its git credential helper and hunk work in your own shells.
#
# Top-level rather than in a profile each: every profile has its own daemon and
# its own sync blob, so each one cost a Touch ID on a cold start. Here they share
# the default daemon and one blob with every other top-level secret.
GITHUB_PERSONAL_ACCESS_TOKEN= { provider = "onepass", value = "op://Employee/Liflig Github PAT/token", env = false }
EXA_API_KEY= { provider = "onepass", value = "op://Employee/Exa API Key/password", env = false }
CONTEXT7_API_KEY= { provider = "onepass", value = "op://Employee/Context7 API Key/credential", env = false }

# Atlassian API token for Jira Cloud, with the account and site it belongs to.
# Read with `fnox get` by the `lazyjira` fish function and by
# television/scripts/jira.sh, so only those receive them. `env = false`.
JIRA_API_TOKEN= { provider = "onepass", value = "op://Employee/Atlassian API Token/credential", env = false }
JIRA_CLOUD_ID= { provider = "onepass", value = "op://Employee/Atlassian API Token/cloudid", env = false }
JIRA_EMAIL= { provider = "onepass", value = "op://Employee/Atlassian API Token/username", env = false }
JIRA_HOST= { provider = "onepass", value = "op://Employee/Atlassian API Token/hostname", env = false }


# Read by the `gcal` fish function, which resolves each value with
# `fnox get -P gcalcli --no-defaults`. gcalcli takes the OAuth client only as
# `--client-id` / `--client-secret` flags, so the values are read into the
# function rather than injected as environment variables.
[profiles.gcalcli.secrets]
GCALCLI_CLIENT_ID = { provider = "onepass", value = "op://Employee/gcalcli/username" }
GCALCLI_CLIENT_SECRET = { provider = "onepass", value = "op://Employee/gcalcli/credential" }
