#:schema https://fnox.jdx.dev/schema.json

# Machine-wide fnox configuration.
#
# Secrets are referenced here, never stored here: the values live in 1Password
# and are resolved on demand. This file is safe to commit.
#
# Not stowed, and must stay out of git: ~/.config/fnox/age.txt (age identity).

# Keep secrets out of the interactive shell. They are injected only into
# `fnox exec` subprocesses, so an agent launched from this shell inherits
# nothing. Individual secrets can opt back in with `env = true`.
env = "exec"

# Fail loudly rather than running a build with a silently missing credential.
if_missing = "error"

[daemon]
enabled = true
idle_timeout = "8h"

[providers.onepass]
type = "1password"
account = "https://capragroup.1password.eu/"


[providers.sync-age]
type = "age"
recipients = [
  "age1se1qft9hckpthwvn56y8hf68cs79wfsrrlq9ccws6z9hktgsgxjrhtj5rax3vz",
]
key_file = "~/.config/fnox/age-se.txt"

[secrets]
# Read by ~/.m2/settings.xml as ${env.LIFLIG_GITHUB_PAT} and
# ${env.NEXUS_PASSWORD} for the `github` and `vy-nexus` server entries.
LIFLIG_GITHUB_PAT = { provider = "onepass", value = "op://Employee/Liflig Github PAT/token" }
NEXUS_PASSWORD = { provider = "onepass", value = "op://Employee/Vy - Nexus/password" }

# Read only by mise, whose `[settings.github] credential_command` runs
# `fnox get MISE_GITHUB_TOKEN`. Fine-grained, public-repo read and nothing else:
# mise calls the GitHub API only to list releases and fetch assets, so the token
# exists purely to lift the 60/hr anonymous rate limit. `env = false` keeps it
# out of every `fnox exec` subprocess, so maven and the github MCP server never
# receive it.
MISE_GITHUB_TOKEN = { provider = "onepass", value = "op://Employee/mise github token/password", env = false }

# Read by the `gh` fish function, which runs
# `fnox exec -P gh --no-defaults -- gh ...`. The profile exists to scope the
# injection: `--no-defaults` drops the top-level secrets, so gh receives this
# token and nothing else — no Nexus password, no maven PAT. `~/.config/gh/hosts.yml`
# stays empty, so gh has no credential of its own outside this wrapper.
[profiles.gh.secrets]
GH_TOKEN = { provider = "onepass", value = "op://Employee/Liflig Github PAT/token" }

# Read by the github MCP server, which Claude Code starts as
# `fnox exec -P github-mcp --no-defaults -- github-mcp-server stdio`. GitHub's
# remote MCP endpoint has no dynamic client registration, so OAuth cannot be set
# up from here; running the server locally under fnox keeps the token out of
# every other process. The profile is what keeps the startup to one 1Password
# authorization: without `-P github-mcp --no-defaults` the exec resolves every
# top-level secret, so opening a Claude Code session asked for biometrics three
# times and handed the MCP server a Nexus password it has no use for.
[profiles.github-mcp.secrets]
GITHUB_PERSONAL_ACCESS_TOKEN = { provider = "onepass", value = "op://Employee/Liflig Github PAT/token" }

# Read by the `gcal` fish function, which resolves each value with
# `fnox get -P gcalcli --no-defaults`. gcalcli takes the OAuth client only as
# `--client-id` / `--client-secret` flags, so the values are read into the
# function rather than injected as environment variables.
[profiles.gcalcli.secrets]
GCALCLI_CLIENT_ID = { provider = "onepass", value = "op://Employee/gcalcli/username" }
GCALCLI_CLIENT_SECRET = { provider = "onepass", value = "op://Employee/gcalcli/credential" }
