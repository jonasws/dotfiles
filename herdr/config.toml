# herdr configuration, linked to ~/.config/herdr/config.toml.
# Only non-default values live here: `herdr --default-config` prints the rest.
onboarding = false

# Catppuccin Mocha
[theme.custom]
sidebar_bg = "#181825"
active_row_bg = "#313244"
selection_bg = "#45475a"
accent = "#cba6f7"
overlay0 = "#7f849c"
overlay1 = "#9399b2"

# A [[keys.command]] on a default's key silently disables that default, and
# `herdr config check` stays quiet about it. Displaced on purpose:
#   prefix+l        focus_pane_right  (lazygit; ctrl+l covers it)
#   prefix+shift+l  swap_pane_right   (lazygit log)
#   prefix+r        resize_mode       (git repo picker; ctrl+shift+hjkl resizes)
[keys]
# Ctrl rather than alt throughout: Option is the us-altgr-intl compose layer.
remove_worktree = "prefix+ctrl+g"
# Steps through agents in sidebar order. For attention order, prefix+g then
# b filters Go To to blocked agents.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
next_workspace = "prefix+ctrl+n"
previous_workspace = "prefix+ctrl+p"
switch_workspace = "prefix+shift+1..9"
# herdr-splits takes ctrl+l, so clearing moves here.
clear_pane = "prefix+ctrl+l"

# Navigate mode (prefix+w): j/k walk the workspace list, which the picker
# renders vertically, so pane up/down moves to the arrows. Not checked for
# duplicates by `herdr config check`.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"
navigate_pane_down = "down"
navigate_pane_up = "up"

# Pane picker, attention-first. ctrl+alt+k is what WezTerm sends for Cmd+K.
# Channel: television/cable/mine/herdr-sessions.toml
[[keys.command]]
key = ["prefix+f", "ctrl+alt+k"]
type = "popup"
command = "tv herdr-sessions"
width = "90%"
height = "80%"

# Plugin: herdr plugin install hmu332233/herdr-f1
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "dev.minung.herdr-f1.open"
description = "open F1 dashboard"

# Opens in the focused pane's repo; lazygit/popup.yml makes Esc close it.
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "~/.config/herdr/scripts/lazygit-popup.sh status"
description = "lazygit: status"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "~/.config/herdr/scripts/lazygit-popup.sh log"
description = "lazygit: log"
width = "80%"
height = "80%"

# Yazi in the focused pane's directory. The pick variant types the files chosen
# with Enter into that pane, as @path when an agent runs there.
[[keys.command]]
key = "prefix+y"
type = "popup"
command = "~/.config/herdr/scripts/yazi-popup.sh"
description = "yazi: browse"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "~/.config/herdr/scripts/yazi-popup.sh pick"
description = "yazi: pick files into pane"
width = "80%"
height = "80%"

# Enter opens or focuses a workspace for the repo instead of cd.
# Channel: television/cable/git-repos.toml
[[keys.command]]
key = "prefix+r"
type = "popup"
command = "tv git-repos -k 'enter=\"actions:workspace\"'"
width = "90%"
height = "80%"

# Channel: television/cable/mine/hotkeys.toml
[[keys.command]]
key = "prefix+shift+h"
type = "popup"
command = "tv hotkeys"
width = "90%"
height = "80%"

# Channel: television/cable/aws-profiles.toml
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "tv aws-profiles"
width = "80%"
height = "80%"

# herdr-splits: ctrl+hjkl moves and ctrl+shift+hjkl resizes across herdr panes
# and Neovim windows. Plugin: linked from ~/herdr-splits.nvim, a fork of
# lmilojevicc/herdr-splits.nvim, so `herdr plugin update` skips it.
# Neovim side: lazyvim/.../plugins/herdr-splits.lua
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+shift+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "ctrl+shift+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "ctrl+shift+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "ctrl+shift+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

# tsk board, set up by `tsk setup herdr`. Capture moved off tsk's default
# prefix+a, which next_agent owns.
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.config/herdr/scripts/tsk-toggle.sh"
description = "toggle tsk board"

[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "tsk quick capture"

[[keys.command]]
key = "prefix+ctrl+e"
type = "popup"
command = "~/.config/herdr/scripts/tsk-notes.sh"
description = "edit tsk notes in nvim"
width = "80%"
height = "80%"

# Script: claude/hooks/subagent-viewer.sh
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "bash ~/.claude/hooks/subagent-viewer.sh toggle"
description = "toggle subagent viewers"

# proc's live process table for the focused pane's project; ctrl+c closes it.
[[keys.command]]
key = "prefix+ctrl+w"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-$PWD}" && exec proc watch --in .'
description = "proc: processes in this project"
width = "80%"
height = "80%"

[ui]
# fish/functions/herdr.fish rewrites this line for wide terminals.
sidebar_width = 34
sidebar_min_width = 26
sidebar_max_width = 48
show_agent_labels_on_pane_borders = true
# Tabs are named by dan.pane-topic-sync, which leaves hand-named tabs alone.
prompt_new_tab_name = false
# The only part of herdr visible from cmd-tab and Mission Control.
window_title = "{workspace}: {terminal_title}"

# $ctx is context remaining (%), reported by claude/statusline-command.sh. It
# leads its row so the numbers line up, since tokens cannot be right-aligned.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "terminal_title_stripped"],
  [
    { token = "$ctx", fg = "#74c7ec", rules = [
      { lt = 11, fg = "#f38ba8", bold = true },
      { lt = 26, fg = "#f9e2af" },
    ] },
    "workspace",
  ],
]

# OSC 9 through WezTerm; clicking the toast does nothing.
[ui.toast]
delivery = "terminal"
delay_seconds = 5

[ui.sound]
enabled = false

[experimental]
pane_history = true
