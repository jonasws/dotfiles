#:schema https://fnox.jdx.dev/schema.json

# AWS credentials for the cnops tree. One profile per (environment, role): the
# unsuffixed name is LifligDeveloper, `--admin` is LifligAdministrator.
#
#   fnox -P staging exec -- aws s3 ls
#   fnox -P prod--admin exec -- aws cloudformation deploy ...
#
# Each lease is a single-hop AssumeRole on top of `capra-auth`, the MFA'd
# GetSessionToken session that ~/.aws/config exposes via credential_process.
# duration is 1h because role chaining is capped at 1h by AWS regardless of what
# is requested here. The ledger at ~/.local/state/fnox/leases/ reuses a live
# lease until it is within 5 minutes of expiry, so repeated execs within the
# hour cost one AssumeRole, not one each.
#
# The lease key is the STS RoleSessionName: fnox names the session
# fnox-exec-<lease key>, so the -jstr suffix is what puts the user back into
# CloudTrail, the way role_session_name=jstr-* did under aws-vault.

[profiles.gh.secrets]
GH_TOKEN = { provider = "onepass", value = "op://Employee/Vy - Nexus/password" }

[secrets]
# The aws-sts backend exports the three credential variables and nothing else --
# no region. Declared at top level so it merges into every profile in this tree.
AWS_REGION = { default = "eu-west-1" }
AWS_DEFAULT_REGION = { default = "eu-west-1" }

[profiles.build.leases.cnops-build-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::590183946679:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.build--admin.leases.cnops-build-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::590183946679:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.dev.leases.cnops-dev-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::905418089268:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.dev--admin.leases.cnops-dev-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::905418089268:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.staging.leases.cnops-staging-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::851725591219:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.staging--admin.leases.cnops-staging-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::851725591219:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.prod.leases.cnops-prod-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::590183747434:role/LifligDeveloper"
profile = "capra-auth"
