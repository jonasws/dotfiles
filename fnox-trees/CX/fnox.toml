#:schema https://fnox.jdx.dev/schema.json

# AWS credentials for the cn-cx tree. One profile per (environment, role): the
# unsuffixed name is LifligDeveloper, `--admin` is LifligAdministrator.
#
#   fnox -P staging exec -- aws s3 ls
#   fnox -P prod--admin exec -- aws cloudformation deploy ...
#
# Each lease is a single-hop AssumeRole on top of `capra-auth`, the MFA'd
# GetSessionToken session that ~/.aws/config exposes via credential_process.
# duration is 1h because role chaining is capped at 1h by AWS regardless of what
# is requested here. The ledger at ~/.local/state/fnox/leases/ reuses a live
# lease until it is within 5 minutes of expiry, so repeated execs within the
# hour cost one AssumeRole, not one each.
#
# The lease key is the STS RoleSessionName: fnox names the session
# fnox-exec-<lease key>, so the -jstr suffix is what puts the user back into
# CloudTrail, the way role_session_name=jstr-* did under aws-vault.

[profiles.gh.secrets]
GH_TOKEN = { provider = "onepass", value = "op://Employee/Vy - Nexus/password" }

[secrets]
# The aws-sts backend exports the three credential variables and nothing else --
# no region. Declared at top level so it merges into every profile in this tree.
AWS_REGION = { default = "eu-west-1" }
AWS_DEFAULT_REGION = { default = "eu-west-1" }

[profiles.build.leases.cn-cx-build-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::342593763647:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.build--admin.leases.cn-cx-build-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::342593763647:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.dev.leases.cn-cx-dev-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::254670366720:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.dev--admin.leases.cn-cx-dev-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::254670366720:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.staging.leases.cn-cx-staging-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::537452063632:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.staging--admin.leases.cn-cx-staging-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::537452063632:role/LifligAdministrator"
profile = "capra-auth"
duration = "1h"

[profiles.prod.leases.cn-cx-prod-jstr]
type = "aws-sts"
region = "eu-west-1"
role_arn = "arn:aws:iam::631292869571:role/LifligDeveloper"
profile = "capra-auth"
duration = "1h"

[profiles.prod--admin.leases.cn-cx-prod-admin-jstr]
type = "aws-sts"
region = "eu-west-1"
