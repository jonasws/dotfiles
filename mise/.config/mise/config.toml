[settings]
# No `lockfile = true`: that creates a mise.lock in every project mise touches,
# and only this repo's tools are worth locking. Unset still *updates* lockfiles
# that already exist, and the global one is written by `mise lock --global` in
# the update:mise task either way — see mise.toml.
experimental = true
idiomatic_version_file_enable_tools = []
env_cache = true
use_versions_host = true

# The 24h default (mise's own) is the supply-chain guard for the ~75 tools
# above: a yanked or broken "latest" gets caught before it lands. These are the
# exceptions — agent tooling and small single-author CLIs where a same-day fix
# is the reason to upgrade at all, and where waiting a day is the cost rather
# than the protection. Full backend IDs, because a shorthand only matches if
# the tool is declared by shorthand.
minimum_release_age_excludes = [
  "herdr",
  "hunk",
  "github:agavra/tuicr",
  "github:dmtrKovalenko/fff",
  "github:always-further/nono",
  "aqua:github/github-mcp-server",
  "pipx:mcp2cli",
  "go:github.com/isaacphi/mcp-language-server",
  "npm:@earendil-works/pi-coding-agent",
  "github:BurntSushi/bttf",
  "github:huseyinbabal/taws",
  "github:riii111/sabiql",
  "github:fioncat/otree",
  "github:achristmascarl/rainfrog",
  "github:pb33f/printing-press",
  "github:pb33f/wiretap",
  "github:control-theory/gonzo",
  "github:walles/moor",
  "github:pamburus/hl",
  "github:bensadeh/tailspin",
  "github:mfontanini/presenterm",
  "github:ouch-org/ouch",
]

[settings.github]
credential_command = "fnox get MISE_GITHUB_TOKEN"

[env]
# Commands that must run under `fnox exec` to receive their credentials. mise
# orders these ahead of tool directories, so the wrapper here wins over the
# maven that mise itself provisions.
_.path = ["~/.local/bin/wrapped"]
