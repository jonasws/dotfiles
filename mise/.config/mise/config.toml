"github:dmtrKovalenko/fff" = { version = "latest", matching = "fff-mcp", exe = "fff-mcp" }
pre-commit = "latest"
"aqua:github/github-mcp-server" = "1.12.0"

[settings]
experimental = true
idiomatic_version_file_enable_tools = []
env_cache = true
use_versions_host = true

[settings.github]
credential_command = "fnox get MISE_GITHUB_TOKEN"

[env]
# Commands that must run under `fnox exec` to receive their credentials. mise
# orders these ahead of tool directories, so the wrapper here wins over the
# maven that mise itself provisions.
_.path = ["~/.local/bin/wrapped"]
