"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface0)\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_state\
$git_status\
([](fg:green bg:teal)$rust$golang$nodejs$java${custom.kotlin}$python[](fg:teal bg:mauve))\
${custom.nolang}\
$time\
[ ](fg:mauve)\
$line_break$character"""

right_format="""
$status\
$cmd_duration\
$aws"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[directory]
style = "fg:mantle bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'
truncation_length = 32

[git_state]
style = "bg:green"
format = '[[ $state( $progress_current/$progress_total) ](fg:base bg:green)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:base bg:green)]($style)'

[nodejs]
symbol = ""
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_extensions = ["js", "mjs", "cjs", "ts"]
detect_folders = []
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[rust]
symbol = ""
detect_files = ["Cargo.toml"]
detect_extensions = ["rs"]
detect_folders = []
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[golang]
symbol = ""
detect_files = ["go.mod"]
detect_extensions = ["go"]
detect_folders = []
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[php]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[java]
symbol = " "
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts"]
detect_extensions = ["java"]
detect_folders = []
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[custom.kotlin]
description = "Kotlin language version from pom.xml; the kotlin binary is not installed"
detect_files = ["pom.xml"]
shell = ["/bin/sh"]
command ="sed -n 's:.*<kotlin.compiler.languageVersion>\\(.*\\)</kotlin.compiler.languageVersion>.*:\\1:p' pom.xml | head -n 1"
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $output) ](fg:base bg:teal)]($style)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[python]
symbol = ""
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]
detect_extensions = ["py"]
detect_folders = []
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

# Fills the slot's place when no language module has anything to show. Its marker
# list must match the detect_* settings of the language modules above.
[custom.nolang]
description = "Green-to-mauve arrow when the language segment is empty"
shell = ["/bin/sh"]
when = 'for f in Cargo.toml go.mod package.json .nvmrc .node-version pom.xml build.gradle build.gradle.kts pyproject.toml requirements.txt .python-version *.rs *.go *.js *.mjs *.cjs *.ts *.java *.py; do [ -e "$f" ] && exit 1; done; exit 0'
command = "printf x"
format = '[](fg:green bg:mauve)'

[time]
disabled = false
time_format = "%R"
style = "bg:peach"
format = '[[  $time ](fg:mantle bg:mauve)]($style)'

[cmd_duration]
min_time = 3000
style = "fg:yellow"
format = "[⏱ $duration]($style) "

[status]
disabled = false
symbol = "✘ "
style = "fg:red"
format = "[$symbol$status]($style) "

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:mauve)'
vimcmd_replace_symbol = '[](bold fg:mauve)'
vimcmd_visual_symbol = '[](bold fg:lavender)'
